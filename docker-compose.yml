        condition: service_healthy
    environment:
      <<: *otel-env
      LKM_ENV: production
      LKM_JWT_SECRET: ${LKM_JWT_SECRET:?生产需设置 LKM_JWT_SECRET}
      LKM_TOTP_ENCRYPTION_KEY: ${LKM_TOTP_ENCRYPTION_KEY:?生产需设置 LKM_TOTP_ENCRYPTION_KEY}
      LKM_VERIFICATION_CODE_PEPPER: ${LKM_VERIFICATION_CODE_PEPPER:?生产需设置 LKM_VERIFICATION_CODE_PEPPER}
      LKM_REDIS_URL: redis://redis:6379/0
      LKM_PULSAR_URL: pulsar://pulsar:6650
      LKM_DB_HOST: postgres
      LKM_DB_PORT: 5432
      LKM_DB_NAME: ${POSTGRES_DB:-lkm}
      LKM_DB_USER: ${POSTGRES_USER:-lkm}
      LKM_DB_PASSWORD: ${POSTGRES_PASSWORD:?生产需设置 POSTGRES_PASSWORD}
