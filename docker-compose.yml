  worker-notify:
    image: lkm-service:latest
    command: ['python', '-m', 'app.core.worker_notify']
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      pulsar:
        condition: service_healthy
    environment:
      <<: *otel-env
      LKM_ENV: production
      LKM_JWT_SECRET: ${LKM_JWT_SECRET:?生产需设置 LKM_JWT_SECRET}
      LKM_TOTP_ENCRYPTION_KEY: ${LKM_TOTP_ENCRYPTION_KEY:?生产需设置 LKM_TOTP_ENCRYPTION_KEY}
      LKM_VERIFICATION_CODE_PEPPER: ${LKM_VERIFICATION_CODE_PEPPER:?生产需设置 LKM_VERIFICATION_CODE_PEPPER}
      LKM_REDIS_URL: redis://redis:6379/0
      LKM_PULSAR_URL: pulsar://pulsar:6650
      LKM_DB_HOST: postgres
      LKM_DB_PORT: 5432
      LKM_DB_NAME: ${POSTGRES_DB:-lkm}
      LKM_DB_USER: ${POSTGRES_USER:-lkm}
      LKM_DB_PASSWORD: ${POSTGRES_PASSWORD:?生产需设置 POSTGRES_PASSWORD}
    restart: ${LKM_RESTART_POLICY:-no}
    networks:
      - lkm

  # 消费 biz/points.apply 生成站内信（与 points 三订阅同 topic 不同订阅，故障隔离）。
  # 需 auth 读缝（触发者展示名），与 backend 同款配置。
  worker-notification:
    image: lkm-service:latest
    command: ['python', '-m', 'app.core.worker_notification']
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      pulsar:
        condition: service_healthy
      auth:
        condition: service_healthy
    environment:
      <<: *otel-env
      LKM_ENV: production
      LKM_JWT_SECRET: ${LKM_JWT_SECRET:?生产需设置 LKM_JWT_SECRET}
      LKM_TOTP_ENCRYPTION_KEY: ${LKM_TOTP_ENCRYPTION_KEY:?生产需设置 LKM_TOTP_ENCRYPTION_KEY}
      LKM_VERIFICATION_CODE_PEPPER: ${LKM_VERIFICATION_CODE_PEPPER:?生产需设置 LKM_VERIFICATION_CODE_PEPPER}
      LKM_REDIS_URL: redis://redis:6379/0
      LKM_PULSAR_URL: pulsar://pulsar:6650
      LKM_DB_HOST: postgres
      LKM_DB_PORT: 5432
      LKM_DB_NAME: ${POSTGRES_DB:-lkm}
      LKM_DB_USER: ${POSTGRES_USER:-lkm}
      LKM_DB_PASSWORD: ${POSTGRES_PASSWORD:?生产需设置 POSTGRES_PASSWORD}
      LKM_AUTH_HTTP_URL: ${LKM_AUTH_HTTP_URL:-http://auth:8001}
      LKM_AUTH_HTTP_TOKEN: ${LKM_AUTH_HTTP_TOKEN:?生产需设置 LKM_AUTH_HTTP_TOKEN}
    restart: ${LKM_RESTART_POLICY:-no}
    networks:
      - lkm

  worker-scheduler:
    image: lkm-service:latest
    command: ['python', '-m', 'app.core.worker_scheduler']
    depends_on:
      pulsar:
        condition: service_healthy
    environment:
      <<: *otel-env
      LKM_ENV: production
      LKM_JWT_SECRET: ${LKM_JWT_SECRET:?生产需设置 LKM_JWT_SECRET}
      LKM_TOTP_ENCRYPTION_KEY: ${LKM_TOTP_ENCRYPTION_KEY:?生产需设置 LKM_TOTP_ENCRYPTION_KEY}
      LKM_VERIFICATION_CODE_PEPPER: ${LKM_VERIFICATION_CODE_PEPPER:?生产需设置 LKM_VERIFICATION_CODE_PEPPER}
      LKM_PULSAR_URL: pulsar://pulsar:6650
    restart: ${LKM_RESTART_POLICY:-no}
    networks:
      - lkm

  worker-dlq:
    image: lkm-service:latest
    command: ['python', '-m', 'app.core.worker_dlq']
    depends_on:
      postgres:
        condition: service_healthy
      pulsar:
        condition: service_healthy
    environment:
      <<: *otel-env
      LKM_ENV: production
      LKM_JWT_SECRET: ${LKM_JWT_SECRET:?生产需设置 LKM_JWT_SECRET}
      LKM_TOTP_ENCRYPTION_KEY: ${LKM_TOTP_ENCRYPTION_KEY:?生产需设置 LKM_TOTP_ENCRYPTION_KEY}
      LKM_VERIFICATION_CODE_PEPPER: ${LKM_VERIFICATION_CODE_PEPPER:?生产需设置 LKM_VERIFICATION_CODE_PEPPER}
      LKM_PULSAR_URL: pulsar://pulsar:6650
      LKM_DB_HOST: postgres
      LKM_DB_PORT: 5432
      LKM_DB_NAME: ${POSTGRES_DB:-lkm}
      LKM_DB_USER: ${POSTGRES_USER:-lkm}
      LKM_DB_PASSWORD: ${POSTGRES_PASSWORD:?生产需设置 POSTGRES_PASSWORD}
    restart: ${LKM_RESTART_POLICY:-no}
    networks:
      - lkm

  # outbox relay（M1）：单 leader（Redis 租约）轮询 outbox_events，把 DB 落 event 经
  # core.messaging.publish 发布到 Pulsar。需 DB（读 outbox）+ Redis（租约）+ Pulsar。
  worker-outbox:
    image: lkm-service:latest
    command: ['python', '-m', 'app.core.worker_outbox']
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      pulsar:
        condition: service_healthy
    environment:
      <<: *otel-env
      LKM_ENV: production
      LKM_JWT_SECRET: ${LKM_JWT_SECRET:?生产需设置 LKM_JWT_SECRET}
      LKM_TOTP_ENCRYPTION_KEY: ${LKM_TOTP_ENCRYPTION_KEY:?生产需设置 LKM_TOTP_ENCRYPTION_KEY}
      LKM_VERIFICATION_CODE_PEPPER: ${LKM_VERIFICATION_CODE_PEPPER:?生产需设置 LKM_VERIFICATION_CODE_PEPPER}
      LKM_REDIS_URL: redis://redis:6379/0
      LKM_PULSAR_URL: pulsar://pulsar:6650
      LKM_DB_HOST: postgres
      LKM_DB_PORT: 5432
      LKM_DB_NAME: ${POSTGRES_DB:-lkm}
      LKM_DB_USER: ${POSTGRES_USER:-lkm}
      LKM_DB_PASSWORD: ${POSTGRES_PASSWORD:?生产需设置 POSTGRES_PASSWORD}
    restart: ${LKM_RESTART_POLICY:-no}
    networks:
      - lkm

  # ── Prefect 编排：复杂数据管道 flow 的 server/worker ──
  # 调度：APScheduler 只做简单 cron 触发入口（cron.* 经总线），
  # DAG/失败重试/回填由 Prefect flow 编排。默认不启；启用：
  #   根 .env 置 LKM_PREFECT_ENABLED/API_URL/DEPLOYMENT（见 .env.example）
  #   docker compose --profile prefect up -d
  # UI 不发布公网端口（运维经 SSH 隧道访问 server:4200）；与主栈 profile 隔离，可独立 down。
  prefect-postgres:
    image: postgres:16-alpine
    profiles: ['prefect']
    environment:
      POSTGRES_USER: prefect
      POSTGRES_PASSWORD: ${PREFECT_DB_PASSWORD:-change-me-prefect-db}
      POSTGRES_DB: prefect
    volumes:
      - prefect_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U prefect -d prefect']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: ${LKM_RESTART_POLICY:-no}
    networks:
      - lkm

  prefect-server:
    image: lkm-service:latest
    profiles: ['prefect']
    depends_on:
      prefect-postgres:
        condition: service_healthy
    environment:
      LKM_INFISICAL_ENABLED: ${LKM_INFISICAL_ENABLED:-false}
      PREFECT_API_DATABASE_CONNECTION_URL: postgresql+asyncpg://prefect:${PREFECT_DB_PASSWORD:-change-me-prefect-db}@prefect-postgres:5432/prefect
    command: ['prefect', 'server', 'start', '--host', '0.0.0.0']
    expose:
      - '4200'
    healthcheck:
      test:
        [
          'CMD',
          'python',
          '-c',
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:4200/api/health', timeout=5)",
        ]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 40s
    restart: ${LKM_RESTART_POLICY:-no}
    networks:
      - lkm

  # 一次性：注册 work pool 与 deployment（幂等，可重跑）
  prefect-init:
    image: lkm-service:latest
    profiles: ['prefect']
    depends_on:
      prefect-server:
        condition: service_healthy
    environment:
      LKM_INFISICAL_ENABLED: ${LKM_INFISICAL_ENABLED:-false}
      PREFECT_API_URL: http://prefect-server:4200/api
      LKM_PREFECT_WORK_POOL: ${LKM_PREFECT_WORK_POOL:-lkm}
      LKM_PREFECT_FLOW_DEPLOYMENT_NAME: ${LKM_PREFECT_FLOW_DEPLOYMENT_NAME:-reconcile}
    command:
      - sh
      - -c
      - prefect work-pool create "$$LKM_PREFECT_WORK_POOL" --type process || true; python -m app.flows.deploy
    restart: ${LKM_RESTART_POLICY:-no}
    networks:
      - lkm

  # process 型 work pool：flow 直接在 worker 容器内以本地源码执行，复用 lkm-service 镜像。
  # 环境集比照 jobs worker（flow 会建 auth+业务双会话、用 Redis 锁），另加 PREFECT_API_URL。
  prefect-worker:
    image: lkm-service:latest
    profiles: ['prefect']
    depends_on:
      prefect-server:
        condition: service_healthy
      prefect-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      LKM_ENV: production
      LKM_JWT_SECRET: ${LKM_JWT_SECRET:?生产需设置 LKM_JWT_SECRET}
      LKM_TOTP_ENCRYPTION_KEY: ${LKM_TOTP_ENCRYPTION_KEY:?生产需设置 LKM_TOTP_ENCRYPTION_KEY}
      LKM_VERIFICATION_CODE_PEPPER: ${LKM_VERIFICATION_CODE_PEPPER:?生产需设置 LKM_VERIFICATION_CODE_PEPPER}
      LKM_REDIS_URL: redis://redis:6379/0
      LKM_DB_HOST: postgres
      LKM_DB_PORT: 5432
      LKM_DB_NAME: ${POSTGRES_DB:-lkm}
      LKM_DB_USER: ${POSTGRES_USER:-lkm}
      LKM_DB_PASSWORD: ${POSTGRES_PASSWORD:?生产需设置 POSTGRES_PASSWORD}
      LKM_AUTH_DB_HOST: postgres
      LKM_AUTH_DB_PORT: 5432
      LKM_AUTH_DB_NAME: ${LKM_AUTH_DB:-lkm_auth}
      LKM_AUTH_DB_USER: ${POSTGRES_USER:-lkm}
      LKM_AUTH_DB_PASSWORD: ${POSTGRES_PASSWORD:?生产需设置 POSTGRES_PASSWORD}
      # ClickHouse 分析管道（M5 7.2.6）：flow 在 worker 内执行导出，需连 CH（默认关则 no-op）
      LKM_CLICKHOUSE_ENABLED: ${LKM_CLICKHOUSE_ENABLED:-false}
      LKM_CLICKHOUSE_URL: ${LKM_CLICKHOUSE_URL:-http://clickhouse:8123}
      LKM_CLICKHOUSE_DATABASE: ${LKM_CLICKHOUSE_DATABASE:-lkm}
      LKM_CLICKHOUSE_USER: ${CLICKHOUSE_USER:-lkm}
      LKM_CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-change-me-clickhouse}
      PREFECT_API_URL: http://prefect-server:4200/api
    command: ['prefect', 'worker', 'start', '--pool', '${LKM_PREFECT_WORK_POOL:-lkm}', '--type', 'process']
    restart: ${LKM_RESTART_POLICY:-no}
    networks:
      - lkm

  # ══════════════════════════════════════════════════════════════════════════
  # SigNoz 自托管（批 6，profile=signoz）：APM/链路追踪后端。**默认不启**。
  #
  # 与下面两个 profile 刻意隔离，互不共用实例：
  #   - `profile: clickhouse` 的 `clickhouse` 是**日志/审计分析库**（app_logs 等）；
  #   - `profile: otel` 的 `otel-collector` 是**应用侧采集器**：它把 span 经 otlphttp
  #     转给本组的 `signoz-otel-collector`（见 deploy/otel/otel-collector.yaml）。
  # SigNoz 自带一套 ClickHouse + ZooKeeper，两者 schema 完全不同，混用必冲突，故各起一套。
  #
  # 起：`docker compose --profile signoz up -d`（连同 otel 链路请写
  #     `--profile otel --profile signoz`，并置 LKM_OTEL_ENABLED=true）。
  # 停：`docker compose --profile signoz down`（数据在 signoz-* 命名卷里，down 不删）。
  #
  # 资源占用大（ClickHouse + ZooKeeper + collector + UI，内存建议 ≥4GB 空闲）；
  # UI 只绑回环 127.0.0.1:8080，公网暴露请自行经网关加鉴权。
  #
  # 配置来源：SigNoz 官方 **v0.128.0** 的 deploy/{docker,common}（vendor 到 deploy/signoz/，
  # 保持单一来源、不手改；升级即整目录替换）。注意上游 main 已改用 Foundry 安装，
  # 故这里**钉死 tag**而不是跟 main（路线图 §8 有登记）。
  signoz-init-clickhouse:
    image: clickhouse/clickhouse-server:25.5.6
    profiles: ['signoz']
    # 一次性：拉取 histogramQuantile UDF 可执行文件到共享卷（custom-function.xml 引用它）。
    # 这一步**需要容器出网**（GitHub Releases）；受限网络下会失败，此时 ClickHouse 仍能起，
    # 但用到 histogramQuantile 的查询（部分告警/面板）会报函数缺失。
    command:
      - bash
      - -c
      - |
        version="v0.0.1"
        node_os=$$(uname -s | tr '[:upper:]' '[:lower:]')
        node_arch=$$(uname -m | sed s/aarch64/arm64/ | sed s/x86_64/amd64/)
        echo "Fetching histogram-binary for $${node_os}/$${node_arch}"
        cd /tmp
        # 拉取失败**不阻断**：ClickHouse 照常启动，只有用到 histogramQuantile 的查询会报函数缺失。
        # 否则受限网络下 init 非零退出 → depends_on service_completed_successfully 卡住整个 SigNoz。
        wget -O histogram-quantile.tar.gz "https://github.com/SigNoz/signoz/releases/download/histogram-quantile%2F$${version}/histogram-quantile_$${node_os}_$${node_arch}.tar.gz" \
          && tar -xvzf histogram-quantile.tar.gz \
          && mv histogram-quantile /var/lib/clickhouse/user_scripts/histogramQuantile \
          || echo "[signoz-init] histogramQuantile UDF 拉取失败（离线/受限网络），跳过"

    volumes:
      - signoz_clickhouse_scripts:/var/lib/clickhouse/user_scripts/
    restart: 'no'
    networks:
      - signoz

  signoz-zookeeper:
    image: signoz/zookeeper:3.7.1
    profiles: ['signoz']
    user: root
    # 官方 cluster.xml 里 ZooKeeper 主机名写死为 `zookeeper-1`，故在此打网络别名，
    # 保持 vendored 配置逐字节不改（改配置会与上游脱钩，升级即冲突）。
    networks:
      signoz:
        aliases:
          - zookeeper-1
    volumes:
      - signoz_zookeeper:/bitnami/zookeeper
    environment:
      ZOO_SERVER_ID: '1'
      ALLOW_ANONYMOUS_LOGIN: 'yes'
      ZOO_AUTOPURGE_INTERVAL: '1'
      ZOO_ENABLE_PROMETHEUS_METRICS: 'yes'
      ZOO_PROMETHEUS_METRICS_PORT_NUMBER: '9141'
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'curl -s -m 2 http://localhost:8080/commands/ruok | grep error | grep null',
        ]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: ${LKM_RESTART_POLICY:-no}

  signoz-clickhouse:
    image: clickhouse/clickhouse-server:25.5.6
    profiles: ['signoz']
    tty: true
    depends_on:
      signoz-init-clickhouse:
        condition: service_completed_successfully
      signoz-zookeeper:
        condition: service_healthy
    environment:
      CLICKHOUSE_SKIP_USER_SETUP: '1'
    volumes:
      - ./deploy/signoz/clickhouse/config.xml:/etc/clickhouse-server/config.xml:ro
      - ./deploy/signoz/clickhouse/users.xml:/etc/clickhouse-server/users.xml:ro
      - ./deploy/signoz/clickhouse/custom-function.xml:/etc/clickhouse-server/custom-function.xml:ro
      - ./deploy/signoz/clickhouse/cluster.xml:/etc/clickhouse-server/config.d/cluster.xml:ro
      - signoz_clickhouse_scripts:/var/lib/clickhouse/user_scripts/
      - signoz_clickhouse:/var/lib/clickhouse/
    ulimits:
      nproc: 65535
      nofile:
        soft: 262144
        hard: 262144
    healthcheck:
      test: ['CMD', 'wget', '--spider', '-q', '0.0.0.0:8123/ping']
      interval: 30s
      timeout: 5s
      retries: 3
    restart: ${LKM_RESTART_POLICY:-no}
    networks:
      signoz:
        # 官方配置里主机名写死 `clickhouse`（otel-collector-config.yaml 的 DSN、
        # cluster.xml 的 distributed DDL 目标），故在本专用网络上打该别名。
        # 与日志分析用的 `clickhouse` 服务不冲突：它在 lkm 网络，两网互不可见。
        aliases:
          - clickhouse

  # 一次性：建库建表（bootstrap + sync up + async up），跑完即退。
  signoz-migrator:
    image: signoz/signoz-otel-collector:v0.144.5
    profiles: ['signoz']
    depends_on:
      signoz-clickhouse:
        condition: service_healthy
    entrypoint: ['/bin/sh']
    command:
      - -c
      - |
        /signoz-otel-collector migrate bootstrap &&
        /signoz-otel-collector migrate sync up &&
        /signoz-otel-collector migrate async up
    environment:
      SIGNOZ_OTEL_COLLECTOR_CLICKHOUSE_DSN: tcp://signoz-clickhouse:9000
      SIGNOZ_OTEL_COLLECTOR_CLICKHOUSE_CLUSTER: cluster
      SIGNOZ_OTEL_COLLECTOR_CLICKHOUSE_REPLICATION: 'true'
      SIGNOZ_OTEL_COLLECTOR_TIMEOUT: 10m
    restart: 'no'
    networks:
      - signoz

  signoz-otel-collector:
    image: signoz/signoz-otel-collector:v0.144.5
    profiles: ['signoz']
    depends_on:
      signoz-clickhouse:
        condition: service_healthy
    entrypoint: ['/bin/sh']
    command:
      - -c
      - |
        /signoz-otel-collector migrate sync check &&
        /signoz-otel-collector --config=/etc/otel-collector-config.yaml --manager-config=/etc/manager-config.yaml --copy-path=/var/tmp/collector-config.yaml
    volumes:
      - ./deploy/signoz/otel-collector-config.yaml:/etc/otel-collector-config.yaml:ro
      - ./deploy/signoz/otel-collector-opamp-config.yaml:/etc/manager-config.yaml:ro
    environment:
      OTEL_RESOURCE_ATTRIBUTES: host.name=signoz-host,os.type=linux
      LOW_CARDINAL_EXCEPTION_GROUPING: 'false'
      SIGNOZ_OTEL_COLLECTOR_CLICKHOUSE_DSN: tcp://signoz-clickhouse:9000
      SIGNOZ_OTEL_COLLECTOR_CLICKHOUSE_CLUSTER: cluster
      SIGNOZ_OTEL_COLLECTOR_CLICKHOUSE_REPLICATION: 'true'
      SIGNOZ_OTEL_COLLECTOR_TIMEOUT: 10m
    expose:
      - '4317'
      - '4318'
    restart: ${LKM_RESTART_POLICY:-no}
    # 同时挂 lkm：应用侧 `otel-collector`（profile otel）要把 span 转进来。
    # 不发布 4317/4318 到宿主：外部代理应经应用侧 collector 或自行网关加鉴权。
    networks:
      - lkm
      - signoz

  signoz:
    image: signoz/signoz:v0.128.0
    profiles: ['signoz']
    depends_on:
      signoz-clickhouse:
        condition: service_healthy
    environment:
      SIGNOZ_ALERTMANAGER_PROVIDER: signoz
      SIGNOZ_TELEMETRYSTORE_CLICKHOUSE_DSN: tcp://signoz-clickhouse:9000
      SIGNOZ_SQLSTORE_SQLITE_PATH: /var/lib/signoz/signoz.db
      # UI 自身会话签名密钥（非应用 JWT）。生产请覆盖为强随机值。
      SIGNOZ_TOKENIZER_JWT_SECRET: ${LKM_SIGNOZ_JWT_SECRET:-change-me-signoz-ui}
    volumes:
      - signoz_sqlite:/var/lib/signoz/
    # 只绑回环：SigNoz UI 无内置鉴权，别直接暴露公网（与 grafana 同款取舍）。
    ports:
      - '127.0.0.1:8080:8080'
    healthcheck:
      test: ['CMD', 'wget', '--spider', '-q', 'localhost:8080/api/v1/health']
      interval: 30s
      timeout: 5s
      retries: 3
    restart: ${LKM_RESTART_POLICY:-no}
    networks:
      - signoz

volumes:
  certbot_conf:
  certbot_www:
  apisix_conf:
  infisical_db_data:
  prefect_pg_data:
  clickhouse_data:
  backend_data:
  postgres_data:
  redis_data:
  minio_data:
  pulsar_data:
  prometheus_data:
  grafana_data:
  # SigNoz 自托管（批 6）：数据卷独立命名，与日志分析用的 clickhouse_data 互不相通
  signoz_clickhouse:
  signoz_clickhouse_scripts:
  signoz_sqlite:
  signoz_zookeeper:
  # bot 沙箱 Bay 自身的数据（bay.db / ship 元数据）；沙箱内文件走宿主机 bind（SHIP_DATA_DIR）
  lkmbot_shipyard_data:

networks:
  lkm:
    driver: bridge
  # bot 代码沙箱专用网络（profile=bot）。显式 name：shipyard 的 DOCKER_NETWORK 环境变量按
  # **字面网络名**让 Docker API 把沙箱容器接进来，compose 默认的 `<项目>_<键>` 前缀名对不上。
  # 独立于 lkm 是本网络存在的唯一理由：沙箱里跑的是模型生成的代码，不能让它够到
  # postgres/redis/minio。
  bot_sandbox:
    name: lkm-bot-sandbox
    driver: bridge
  # SigNoz 专用内网：其 otel-collector-config.yaml 里写死 `tcp://clickhouse:9000`，
  # 而本仓日志分析库的服务名也叫 `clickhouse`——用独立网络彻底隔离，避免同名歧义。
  signoz:
    driver: bridge
