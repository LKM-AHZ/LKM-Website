services:
  nginx:
    image: nginx:1.27-alpine
    entrypoint: ['sh', '/entrypoint.sh']
    command: ['nginx', '-g', 'daemon off;']
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./deploy/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./deploy/nginx/proxy-common-headers.conf:/etc/nginx/proxy-common-headers.conf:ro
      - ./deploy/nginx/entrypoint.sh:/entrypoint.sh:ro
      - certbot_conf:/etc/letsencrypt
      - certbot_www:/var/www/certbot:ro
    restart: unless-stopped
    depends_on:
      astro:
        condition: service_healthy
      backend:
        condition: service_healthy
      static:
        condition: service_started
    networks:
      - lkm

  certbot:
    image: certbot/certbot
    entrypoint: ['sh', '/certbot-entrypoint.sh']
    volumes:
      - ./deploy/nginx/certbot-entrypoint.sh:/certbot-entrypoint.sh:ro
      - certbot_conf:/etc/letsencrypt
      - certbot_www:/var/www/certbot
    restart: unless-stopped
    depends_on:
      - nginx
    networks:
      - lkm

  astro:
    build:
      context: ./LKM-official-website
      dockerfile: Dockerfile
      target: runner
    image: lkm-official-website:latest
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 4321
      API_URL: http://backend:8000
      PUBLIC_SITE_URL: https://lkm-ahz.ltd
    restart: unless-stopped
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:4321/robots.txt']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'
    networks:
      - lkm

  static:
    build:
      context: ./LKM-official-static
      dockerfile: static.Dockerfile
    image: lkm-official-static:latest
    ports:
      - '${LKM_STATIC_PORT:-8082}:80'
    restart: unless-stopped
    networks:
      - lkm

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-lkm}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?生产需设置 POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-lkm}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # S5-A2 Step3：首启 initdb 补建独立 AUTH 库 lkm_auth(仅空数据卷首次执行)；只读挂载。
      - ./deploy/initdb:/docker-entrypoint-initdb.d:ro
    restart: unless-stopped
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - lkm

  redis:
    image: redis:7-alpine
    command: ['redis-server', '--appendonly', 'yes']
    volumes:
      - redis_data:/data
    restart: unless-stopped
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - lkm

  rabbitmq:
    image: rabbitmq:3.13-management
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER:-lkm}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS:?生产需设置 RABBITMQ_DEFAULT_PASS}
    ports:
      - '15672:15672'
    healthcheck:
      test: ['CMD', 'rabbitmq-diagnostics', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - lkm

  minio:
    image: minio/minio:latest
    command: ['server', '/data', '--console-address', ':9001']
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-lkmadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?生产需设置 MINIO_ROOT_PASSWORD}
    volumes:
      - minio_data:/data
    expose:
      - '9000'
      - '9001'
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:9000/minio/health/ready']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - lkm

  backend:
    build:
      context: ./LKM-service
      dockerfile: Dockerfile
    image: lkm-service:latest
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    environment:
      LKM_ENV: production
      LKM_DB_HOST: postgres
      LKM_DB_PORT: 5432
      LKM_DB_NAME: ${POSTGRES_DB:-lkm}
      LKM_DB_USER: ${POSTGRES_USER:-lkm}
      LKM_DB_PASSWORD: ${POSTGRES_PASSWORD:?生产需设置 POSTGRES_PASSWORD}
      LKM_REDIS_URL: redis://redis:6379/0
      LKM_RABBIT_URL: amqp://lkm:${RABBITMQ_DEFAULT_PASS}@rabbitmq:5672/
      # 多 worker：按压测基线调，默认单 worker；多核下水平跑满 CPU
      LKM_WEB_WORKERS: ${LKM_WEB_WORKERS:-1}
      LKM_BLOG_REPO_DIR: /data/blog_repos
      # 对象存储(MinIO)：文件/头像读写走 S3 后端
      LKM_STORAGE_BACKEND: s3
      LKM_S3_ENDPOINT_URL: http://minio:9000
      # 预签名直传/下载对浏览器暴露地址：MinIO 经 nginx /lkm/ 转发，host 用站点公网地址
      LKM_S3_PUBLIC_ENDPOINT_URL: ${LKM_S3_PUBLIC_ENDPOINT_URL:-http://124.220.55.235}
      LKM_S3_BUCKET: ${LKM_S3_BUCKET:-lkm}
      LKM_S3_PREFIX: ${LKM_S3_PREFIX:-files}
      LKM_S3_ACCESS_KEY: ${MINIO_ROOT_USER:-lkmadmin}
      LKM_S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:?生产需设置 MINIO_ROOT_PASSWORD}
      # LKM_FILES_STORE_DIR 仅作迁移脚本参考；运行时对象存于 MinIO（本地路径可保留供迁移读取）
      LKM_FILES_STORE_DIR: /data/files_store
      LKM_JWT_SECRET: ${LKM_JWT_SECRET:?生产需设置 LKM_JWT_SECRET}
      LKM_TOTP_ENCRYPTION_KEY: ${LKM_TOTP_ENCRYPTION_KEY:?生产需设置 LKM_TOTP_ENCRYPTION_KEY}
      LKM_VERIFICATION_CODE_PEPPER: ${LKM_VERIFICATION_CODE_PEPPER:?生产需设置 LKM_VERIFICATION_CODE_PEPPER}
      LKM_GITHUB_CLIENT_ID: ${LKM_GITHUB_CLIENT_ID:-}
      LKM_GITHUB_CLIENT_SECRET: ${LKM_GITHUB_CLIENT_SECRET:-}
      LKM_RP_ID: 124.220.55.235
      LKM_ORIGIN: http://124.220.55.235
      LKM_GITHUB_REDIRECT_URI: http://124.220.55.235/api/v1/auth/oauth/github/callback
      LKM_FRONTEND_CALLBACK: http://124.220.55.235/login/success
    volumes:
      - backend_data:/data
    restart: unless-stopped
    healthcheck:
      test:
        [
          'CMD',
          'python',
          '-c',
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health', timeout=5)",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    networks:
      - lkm

  # AUTH 独立进程（B1.1）：与单体的 backend 同镜像(同代码库/同配置源)、异 command。
  # 跑只读/认证面 `app.main_auth:app`，自持 DB+Redis 依赖与专属 /liveness|/readiness 健康缝。
  # 纯增量、不改单体拓扑：仅内网暴露(无主机端口映射，B1.2 才由 nginx 反代接出)。
  # healthcheck 打本进程自己的 /liveness：进程能应答即心跳 OK；依赖就绪由 below depends_on 判定。
  auth:
    image: lkm-service:latest
    command: ['python', '-m', 'app.main_auth']
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      LKM_ENV: production
      LKM_JWT_SECRET: ${LKM_JWT_SECRET:?生产需设置 LKM_JWT_SECRET}
      LKM_TOTP_ENCRYPTION_KEY: ${LKM_TOTP_ENCRYPTION_KEY:?生产需设置 LKM_TOTP_ENCRYPTION_KEY}
      LKM_VERIFICATION_CODE_PEPPER: ${LKM_VERIFICATION_CODE_PEPPER:?生产需设置 LKM_VERIFICATION_CODE_PEPPER}
      LKM_REDIS_URL: redis://redis:6379/0
      LKM_RABBIT_URL: amqp://lkm:${RABBITMQ_DEFAULT_PASS}@rabbitmq:5672/
      LKM_DB_HOST: postgres
      LKM_DB_PORT: 5432
      LKM_DB_NAME: ${POSTGRES_DB:-lkm}
      LKM_DB_USER: ${POSTGRES_USER:-lkm}
      LKM_DB_PASSWORD: ${POSTGRES_PASSWORD:?生产需设置 POSTGRES_PASSWORD}
      # auth 域专属自足 DB → 独立 auth 库（真拆库：统一 PG），由首启 initdb 建出、
      # owner=同 POSTGRES_USER，auth_session 直连 lkm_auth；与上面 LKM_DB_*(=biz lkm)解耦。
      LKM_AUTH_DB_HOST: postgres
      LKM_AUTH_DB_PORT: 5432
      LKM_AUTH_DB_NAME: ${LKM_AUTH_DB:-lkm_auth}
      LKM_AUTH_DB_USER: ${POSTGRES_USER:-lkm}
      LKM_AUTH_DB_PASSWORD: ${POSTGRES_PASSWORD:?生产需设置 POSTGRES_PASSWORD}
      LKM_RP_ID: ${LKM_RP_ID:-124.220.55.235}
    restart: unless-stopped
    healthcheck:
      test:
        [
          'CMD',
          'python',
          '-c',
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/liveness', timeout=5)",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      - lkm

  worker-send:
    image: lkm-service:latest
    command: ['python', '-m', 'app.core.worker_send']
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    environment:
      LKM_ENV: production
      LKM_JWT_SECRET: ${LKM_JWT_SECRET:?生产需设置 LKM_JWT_SECRET}
      LKM_TOTP_ENCRYPTION_KEY: ${LKM_TOTP_ENCRYPTION_KEY:?生产需设置 LKM_TOTP_ENCRYPTION_KEY}
      LKM_VERIFICATION_CODE_PEPPER: ${LKM_VERIFICATION_CODE_PEPPER:?生产需设置 LKM_VERIFICATION_CODE_PEPPER}
      LKM_REDIS_URL: redis://redis:6379/0
      LKM_RABBIT_URL: amqp://lkm:${RABBITMQ_DEFAULT_PASS}@rabbitmq:5672/
      LKM_DB_HOST: postgres
      LKM_DB_PORT: 5432
      LKM_DB_NAME: ${POSTGRES_DB:-lkm}
      LKM_DB_USER: ${POSTGRES_USER:-lkm}
      LKM_DB_PASSWORD: ${POSTGRES_PASSWORD:?生产需设置 POSTGRES_PASSWORD}
    restart: unless-stopped
    networks:
      - lkm

  worker:
    image: lkm-service:latest
    command: ['python', '-m', 'app.core.worker_default']
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    environment:
      LKM_ENV: production
      LKM_JWT_SECRET: ${LKM_JWT_SECRET:?生产需设置 LKM_JWT_SECRET}
      LKM_TOTP_ENCRYPTION_KEY: ${LKM_TOTP_ENCRYPTION_KEY:?生产需设置 LKM_TOTP_ENCRYPTION_KEY}
      LKM_VERIFICATION_CODE_PEPPER: ${LKM_VERIFICATION_CODE_PEPPER:?生产需设置 LKM_VERIFICATION_CODE_PEPPER}
      LKM_REDIS_URL: redis://redis:6379/0
      LKM_RABBIT_URL: amqp://lkm:${RABBITMQ_DEFAULT_PASS}@rabbitmq:5672/
      LKM_DB_HOST: postgres
      LKM_DB_PORT: 5432
      LKM_DB_NAME: ${POSTGRES_DB:-lkm}
      LKM_DB_USER: ${POSTGRES_USER:-lkm}
      LKM_DB_PASSWORD: ${POSTGRES_PASSWORD:?生产需设置 POSTGRES_PASSWORD}
      LKM_BLOG_REPO_DIR: /data/blog_repos   # 与 backend 同卷同路径
    volumes:
      - backend_data:/data
    restart: unless-stopped
    networks:
      - lkm

  worker-points:
    image: lkm-service:latest
    command: ['python', '-m', 'app.core.worker_points']
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    environment:
      LKM_ENV: production
      LKM_JWT_SECRET: ${LKM_JWT_SECRET:?生产需设置 LKM_JWT_SECRET}
      LKM_TOTP_ENCRYPTION_KEY: ${LKM_TOTP_ENCRYPTION_KEY:?生产需设置 LKM_TOTP_ENCRYPTION_KEY}
      LKM_VERIFICATION_CODE_PEPPER: ${LKM_VERIFICATION_CODE_PEPPER:?生产需设置 LKM_VERIFICATION_CODE_PEPPER}
      LKM_REDIS_URL: redis://redis:6379/0
      LKM_RABBIT_URL: amqp://lkm:${RABBITMQ_DEFAULT_PASS}@rabbitmq:5672/
      LKM_DB_HOST: postgres
      LKM_DB_PORT: 5432
      LKM_DB_NAME: ${POSTGRES_DB:-lkm}
      LKM_DB_USER: ${POSTGRES_USER:-lkm}
      LKM_DB_PASSWORD: ${POSTGRES_PASSWORD:?生产需设置 POSTGRES_PASSWORD}
      LKM_BLOG_REPO_DIR: /data/blog_repos   # 与 backend 同卷同路径
    volumes:
      - backend_data:/data
    restart: unless-stopped
    networks:
      - lkm

  worker-notify:
    image: lkm-service:latest
    command: ['python', '-m', 'app.core.worker_notify']
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    environment:
      LKM_ENV: production
      LKM_REDIS_URL: redis://redis:6379/0
      LKM_RABBIT_URL: amqp://lkm:${RABBITMQ_DEFAULT_PASS}@rabbitmq:5672/
      LKM_DB_HOST: postgres
      LKM_DB_PORT: 5432
      LKM_DB_NAME: ${POSTGRES_DB:-lkm}
      LKM_DB_USER: ${POSTGRES_USER:-lkm}
      LKM_DB_PASSWORD: ${POSTGRES_PASSWORD:?生产需设置 POSTGRES_PASSWORD}
    restart: unless-stopped
    networks:
      - lkm

  worker-scheduler:
    image: lkm-service:latest
    command: ['python', '-m', 'app.core.worker_scheduler']
    depends_on:
      rabbitmq:
        condition: service_healthy
    environment:
      LKM_ENV: production
      LKM_RABBIT_URL: amqp://lkm:${RABBITMQ_DEFAULT_PASS}@rabbitmq:5672/
    restart: unless-stopped
    networks:
      - lkm

  worker-dlq:
    image: lkm-service:latest
    command: ['python', '-m', 'app.core.worker_dlq']
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    environment:
      LKM_ENV: production
      LKM_RABBIT_URL: amqp://lkm:${RABBITMQ_DEFAULT_PASS}@rabbitmq:5672/
      LKM_DB_HOST: postgres
      LKM_DB_PORT: 5432
      LKM_DB_NAME: ${POSTGRES_DB:-lkm}
      LKM_DB_USER: ${POSTGRES_USER:-lkm}
      LKM_DB_PASSWORD: ${POSTGRES_PASSWORD:?生产需设置 POSTGRES_PASSWORD}
    restart: unless-stopped
    networks:
      - lkm

  # outbox relay（M1）：单 leader（Redis 租约）轮询 outbox_events，把 DB 落 event 发布到
  # RabbitMQ lkm.events。需 DB（读 outbox）+ Redis（leader 租约）+ Rabbit（publish）。
  worker-outbox:
    image: lkm-service:latest
    command: ['python', '-m', 'app.core.worker_outbox']
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    environment:
      LKM_ENV: production
      LKM_REDIS_URL: redis://redis:6379/0
      LKM_RABBIT_URL: amqp://lkm:${RABBITMQ_DEFAULT_PASS}@rabbitmq:5672/
      LKM_DB_HOST: postgres
      LKM_DB_PORT: 5432
      LKM_DB_NAME: ${POSTGRES_DB:-lkm}
      LKM_DB_USER: ${POSTGRES_USER:-lkm}
      LKM_DB_PASSWORD: ${POSTGRES_PASSWORD:?生产需设置 POSTGRES_PASSWORD}
    restart: unless-stopped
    networks:
      - lkm

volumes:
  certbot_conf:
  certbot_www:
  backend_data:
  postgres_data:
  redis_data:
  minio_data:

networks:
  lkm:
    driver: bridge
