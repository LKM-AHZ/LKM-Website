# OTel 采集变量（worker / scheduler / outbox / dlq 等非 ASGI 进程共用）。
# 这些进程没有 FastAPI app，但同样需要 provider 才能导出消费/调度/发布 span 与
# inject 进消息的 trace 上下文。默认关；配合 `--profile otel --profile signoz` 与
# LKM_OTEL_ENABLED=true 生效。backend/auth 各自显式声明（服务名后缀不同）。
x-otel-env: &otel-env
  LKM_OTEL_ENABLED: ${LKM_OTEL_ENABLED:-false}
  LKM_OTEL_EXPORTER_OTLP_ENDPOINT: ${LKM_OTEL_EXPORTER_OTLP_ENDPOINT:-}
  LKM_OTEL_SAMPLE_RATIO: ${LKM_OTEL_SAMPLE_RATIO:-0.1}

services:
  # ── APISIX 网关 ──
  # standalone 模式（yaml config_provider，无 etcd）：路由模板 deploy/apisix/apisix.yaml 中的
  # `# __SSL_SECTION__` 占位由 apisix-render 用 certbot 证书渲染为内联 PEM 的 ssls 段，
  # 写入 apisix_conf 卷，APISIX 监测 mtime 自动 reload。
  apisix-render:
    # 纯 shell sidecar（只跑 render.sh 的 sh/awk/sed/openssl），非 Web 服务器角色：
    # 用最小 alpine，不借用任何 Web 服务器镜像。
    image: alpine:3.19
    entrypoint: ['sh', '/src/render.sh']
    environment:
      # 网关配置的**单一来源**：路由 hosts 与 CORS 来源由域名变量展开，请求体上限与后端LKM_MAX_UPLOAD_BYTES 取同一个 env。
      APISIX_COMMUNITY_DOMAINS: ${LKM_COMMUNITY_DOMAINS:-lkm-ahz.ltd}
      APISIX_OFFICIAL_DOMAINS: ${LKM_OFFICIAL_DOMAINS:-lkm-ahz.icu}
      # 注：bot 面板已并入社群域的子路径 /bot/（不再有独立子域），故无 APISIX_BOT_DOMAINS。
      APISIX_MAX_BODY_SIZE: ${LKM_MAX_UPLOAD_BYTES:-104857600}
      # bot 面板请求体上限：与上面那个**独立**（bot 单文件 512MB > 社群站 100MB）
      APISIX_BOT_MAX_BODY_SIZE: ${LKM_BOT_MAX_UPLOAD_BYTES:-550000000}
      # RS256 网关验签（批 5）：RSA 公钥 PEM 文件（容器内路径）。留空 → 网关不做 JWT
      # 校验（应用层照常验签），保持既有部署零改动可升级。生成：sh deploy/jwt/gen-keys.sh
      APISIX_JWT_PUBLIC_KEY_FILE: ${LKM_JWT_PUBLIC_KEY_FILE:-}
    volumes:
      - ./deploy/apisix:/src:ro
      # RSA 公钥（只读）。目录不存在时 docker 会建空目录 → 网关验签自动关闭，不硬失败。
      - ./deploy/jwt/keys:/etc/lkm/jwt:ro
      - certbot_conf:/etc/letsencrypt
      - apisix_conf:/out
    restart: ${LKM_RESTART_POLICY:-no}
    healthcheck:
      # 两个产物都要在：apisix.yaml（路由）+ config.yaml（DNS 解析展开）——
      # apisix 服务依赖本健康检查，缺任一个都会让它起不来
      test: ['CMD-SHELL', 'test -s /out/apisix.yaml -a -s /out/config.yaml']
      interval: 5s
      timeout: 3s
      retries: 24
      start_period: 5s
    networks:
      - lkm

  # 微型 ACME http-01 responder（非网关角色，仅服务 certbot webroot；见 apisix.yaml acme-challenge 路由）
  acme-webroot:
    image: nginx:1.27-alpine
    volumes:
      - ./deploy/apisix/acme-webroot.conf:/etc/nginx/conf.d/default.conf:ro
      - certbot_www:/var/www/certbot:ro
    restart: ${LKM_RESTART_POLICY:-no}
    networks:
      - lkm

  apisix:
    image: apache/apisix:3.9.0-debian
    depends_on:
      apisix-render:
        condition: service_healthy
      astro:
        condition: service_healthy
      backend:
        condition: service_healthy
      static:
        condition: service_started
    ports:
      - '80:9080'
      - '443:9443'
    volumes:
      # config.yaml 与 apisix.yaml 都取 apisix-render 的**渲染产物**（不再是仓库原文件）：
      # config.yaml 里的上游 DNS 由 render 从 APISIX_DNS_RESOLVER 展开（compose 默认
      # 127.0.0.11，与旧行为一致），k8s 侧同一模板展开成 CoreDNS 地址——避免两份 config 副本。
      # 命名卷内子路径单文件挂载（compose 长语法 subpath）：render 就地写同一 inode，
      # APISIX 才能看到 mtime 变化并 reload
      - type: volume
        source: apisix_conf
        target: /usr/local/apisix/conf/config.yaml
        volume:
          subpath: config.yaml
        read_only: true
      - type: volume
        source: apisix_conf
        target: /usr/local/apisix/conf/apisix.yaml
        volume:
          subpath: apisix.yaml
        read_only: true
    healthcheck:
      test: ['CMD-SHELL', 'bash -c "exec 3<>/dev/tcp/127.0.0.1/9080"']
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: ${LKM_RESTART_POLICY:-no}
    networks:
      - lkm

  certbot:
    image: certbot/certbot
    entrypoint: ['sh', '/certbot-entrypoint.sh']
    volumes:
      - ./deploy/certbot/entrypoint.sh:/certbot-entrypoint.sh:ro
      - certbot_conf:/etc/letsencrypt
      - certbot_www:/var/www/certbot
    restart: ${LKM_RESTART_POLICY:-no}
    depends_on:
      - apisix
    networks:
      - lkm

  astro:
    build:
      context: ./LKM-official-website
      dockerfile: Dockerfile
      target: runner
    image: lkm-official-website:latest
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 4321
      API_URL: http://backend:8000
      PUBLIC_SITE_URL: https://lkm-ahz.ltd
    restart: ${LKM_RESTART_POLICY:-no}
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:4321/robots.txt']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'
    networks:
      - lkm

  static:
    build:
      context: ./LKM-official-static
      dockerfile: static.Dockerfile
    image: lkm-official-static:latest
    ports:
      - '${LKM_STATIC_PORT:-8082}:80'
    restart: ${LKM_RESTART_POLICY:-no}
    networks:
      - lkm

  # ── LKM Bot 社区机器人面板（AstrBot fork，profile=bot 可选组件）──
  # 启用：docker compose --profile bot up -d --build
  # 对外只经网关的**社群域子路径** /bot/（`deploy/apisix/apisix.yaml` 的 bot-* 路由，
  # 网关剥前缀后转发到这里），面板由社区后台以同源 iframe 内嵌，登录走社区后台 SSO 免登。
  # **刻意不发布 6185**：面板是管理员面，多一个宿主端口就多一个绕过网关限流的入口。
  # 6199（OneBot v11 / NapCat WebSocket）同样不发布，接法见 DEPLOYMENT.md「LKM Bot」一节。
  lkmbot:
    profiles: ['bot']
    build:
      context: ./LKM-bot
      dockerfile: Dockerfile
      args:
        # 面板前端构建期 base，必须与网关的 /bot 子路径一致（dist 由镜像内构建，
        # 资源引用与 API 前缀都由此决定）。
        VITE_BASE_PATH: /bot/
    image: lkm-bot:latest
    environment:
      TZ: Asia/Shanghai
      # 显式固定 data 路径（默认取 cwd，入口一改就漂移）
      ASTRBOT_ROOT: /LKMBot
      # 必须 0.0.0.0：绑回环会让面板的「默认密码免校验」判定成立（见 auth_service.py），
      # 且网关打容器 IP 会连不上
      DASHBOARD_HOST: 0.0.0.0
      DASHBOARD_PORT: '6185'
      # 面板挂在 /bot 子路径：后端据此收窄 cookie Path 与 302 Location（默认空 = 根路径）。
      ASTRBOT_DASHBOARD_BASE_PATH: /bot
      # 社区后台 SSO 的验签公钥（与网关同一份 jwt-public.pem，只读挂载）。公钥在 → 支持
      # 票据免登；缺失/读不到 → 面板自动回落自带登录页（fail-safe，不影响其余功能）。
      LKM_BOT_SSO_PUBLIC_KEY_FILE: /etc/lkm/jwt/jwt-public.pem
      # 首启面板初始密码；留空则面板自生成随机密码并打到日志
      ASTRBOT_DASHBOARD_INITIAL_PASSWORD: ${LKM_BOT_DASHBOARD_PASSWORD:-}
    # 上游 compose 原有的加固项（根 compose 其余服务都没有，属有益偏离，已登记）
    security_opt:
      - no-new-privileges:true
    # 用宿主机 bind 而非命名卷：shipyard 要把宿主机路径 bind 进它 spawn 的沙箱容器
    # （命名卷没有可用的宿主路径）
    volumes:
      - ./LKM-bot/data:/LKMBot/data
      # RS256 公钥（只读）：与网关同源，bot 只持有公钥（无法伪造社区票据）。
      # 目录不存在时 docker 会建空目录 → SSO 自动关闭，不硬失败。
      - ./deploy/jwt/keys:/etc/lkm/jwt:ro
    healthcheck:
      # bot 没有公开的健康端点，/api/v1/* 又绕过面板鉴权中间件（探活语义不真），故用
      # 「端口在听」——与 acme-webroot 的就绪语义同理
      test:
        ['CMD-SHELL', 'python -c "import socket; socket.create_connection((\"127.0.0.1\", 6185), 3)"']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    restart: ${LKM_RESTART_POLICY:-no}
    networks:
      - lkm

  # ── bot 代码沙箱（上游旧版 Shipyard Bay，profile=bot 可选）──
  # ⚠️ 安全面：挂 docker.sock ≈ 把宿主机 root 交给容器；仅 profile=bot 启用，用完 down。
  # ⚠️ 与 bot 默认 booter 不匹配：bot 默认 sandbox.booter=shipyard_neo，而本服务是**旧 Bay**。
  #    要生效需在面板「配置 → 沙箱」把 booter 改成 shipyard 并填 endpoint http://shipyard:8156
  #    + 这里的 ACCESS_TOKEN（见 DEPLOYMENT.md）。
  # ⚠️ SHIP_DATA_DIR 是**宿主机绝对路径**（bay 原样交给 Docker API 做 bind），默认取自
  #    ${PWD}，故必须从仓库根执行 compose；换目录执行会指向错误位置。
  shipyard:
    profiles: ['bot']
    image: soulter/shipyard-bay:latest
    environment:
      PORT: '8156'
      DATABASE_URL: sqlite+aiosqlite:///./data/bay.db
      ACCESS_TOKEN: ${LKM_BOT_SHIP_ACCESS_TOKEN:-change-me-shipyard}
      MAX_SHIP_NUM: ${LKM_BOT_SHIP_MAX_NUM:-10}
      BEHAVIOR_AFTER_MAX_SHIP: reject
      DOCKER_IMAGE: soulter/shipyard-ship:latest
      # 沙箱容器落在**独立网络**（不是 lkm）：否则被 spawn 的容器能直连
      # postgres/redis/minio，是一条真实越权路径。名字须与下面 networks.bot_sandbox.name 一致。
      DOCKER_NETWORK: lkm-bot-sandbox
      SHIP_DATA_DIR: ${LKM_BOT_SHIP_DATA_DIR:-${PWD}/LKM-bot/data/shipyard/ship_mnt_data}
      DEFAULT_SHIP_CPUS: ${LKM_BOT_SHIP_CPUS:-1.0}
      DEFAULT_SHIP_MEMORY: ${LKM_BOT_SHIP_MEMORY:-512m}
    volumes:
      - lkmbot_shipyard_data:/app/data
      # 与 bot 共享 temp：面板落盘的上传件要能被沙箱读到
      - ./LKM-bot/data/temp:/LKMBot/data/temp
      - /var/run/docker.sock:/var/run/docker.sock:ro
    restart: ${LKM_RESTART_POLICY:-no}
    # 两个网络都要：在 lkm 上 bot 面板才连得到它，在 bot_sandbox 上它才管得到沙箱容器
    networks:
      - lkm
      - bot_sandbox

  # OpenTelemetry Collector（M5 7.2.2，profile=otel）：默认不启，不影响主栈。
  # 启用：LKM_OTEL_ENABLED=true 且 LKM_OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4318/v1/traces
  # 后 `docker compose --profile otel up -d`。内部指标 :8888/metrics 可查接收 span 数。
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.109.0
    profiles: ['otel']
    command: ['--config=/etc/otelcol/config.yaml']
    volumes:
      - ./deploy/otel/otel-collector.yaml:/etc/otelcol/config.yaml:ro
    expose:
      - '4317'
      - '4318'
      - '8888'
    restart: ${LKM_RESTART_POLICY:-no}
    networks:
      - lkm

  # ClickHouse 分析库：默认不启，不影响主栈。
  # 承载 app_logs（vector 采集）+ event_failures/audit_logs（周期增量导出）。
  # 启用：置 LKM_CLICKHOUSE_ENABLED=true + LKM_CLICKHOUSE_* 后
  # `docker compose --profile clickhouse up -d`。DDL 由 deploy/clickhouse/init.sql
  # 在数据卷首启时执行；表结构变更需重建卷（down -v）或手动 ALTER。
  clickhouse:
    image: clickhouse/clickhouse-server:24.8-alpine
    profiles: ['clickhouse']
    environment:
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-lkm}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-change-me-clickhouse}
      CLICKHOUSE_DB: lkm
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: '1'
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    volumes:
      - clickhouse_data:/var/lib/clickhouse
      - ./deploy/clickhouse/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://127.0.0.1:8123/ping || exit 1']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: ${LKM_RESTART_POLICY:-no}
    networks:
      - lkm

  # Vector 日志采集：读 Docker 容器日志 →
  # 解析 core/logging.py 的 JSON → 写 lkm.app_logs。需挂 docker socket 与日志目录。
  vector:
    image: timberio/vector:0.43.0-alpine
    profiles: ['clickhouse']
    depends_on:
      clickhouse:
        condition: service_healthy
    # 镜像自带 /etc/vector/vector.yaml（demo 配置），而 vector 的默认 config 查找顺序
    # **yaml 先于 toml** —— 不显式 --config 会加载 demo 而非本挂载，静默采集假数据。
    command: ['--config', '/etc/vector/vector.toml']
    environment:
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-lkm}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-change-me-clickhouse}
    volumes:
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./deploy/clickhouse/vector.toml:/etc/vector/vector.toml:ro
    restart: ${LKM_RESTART_POLICY:-no}
    networks:
      - lkm

  # Prometheus 指标抓取：只抓 backend 的 /metrics
  # （auth 进程刻意不挂 /metrics，见部署文档「已知限制」）。默认不启。
  prometheus:
    image: prom/prometheus:v2.54.1
    profiles: ['monitoring']
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.retention.time=15d'
    volumes:
      - ./deploy/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    expose:
      - '9090'
    restart: ${LKM_RESTART_POLICY:-no}
    networks:
      - lkm

  # Grafana 总览面板：数据源与 dashboard 均由
  # deploy/grafana/provisioning 预置（QPS/P50/P95/错误率/outbox 积压/Pulsar lag）。
  # 默认只绑回环，公网暴露请自行经网关加鉴权。
  grafana:
    image: grafana/grafana:11.2.0
    profiles: ['monitoring']
    depends_on:
      - prometheus
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${LKM_GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: 'false'
    volumes:
      - ./deploy/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    ports:
      - '127.0.0.1:3000:3000'
    restart: ${LKM_RESTART_POLICY:-no}
    networks:
      - lkm

  # Infisical 密钥管理：默认不启，不影响主栈。
  # 首启后到 Web UI 建项目 + universal-auth machine identity，把 client id/secret 与
  # project id 填回根 .env（LKM_INFISICAL_*），并置 LKM_INFISICAL_ENABLED=true；
  # 应用经 deploy/docker-entrypoint.sh → app.core.secrets_bootstrap 启动前拉取注入。
  infisical-db:
    image: postgres:16-alpine
    profiles: ['infisical']
    environment:
      POSTGRES_USER: infisical
      POSTGRES_PASSWORD: ${INFISICAL_DB_PASSWORD:-change-me-infisical-db}
      POSTGRES_DB: infisical
    volumes:
      - infisical_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U infisical -d infisical']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: ${LKM_RESTART_POLICY:-no}
    networks:
      - lkm

  infisical:
    image: infisical/infisical:latest
    profiles: ['infisical']
    depends_on:
      infisical-db:
        condition: service_healthy
    environment:
      ENCRYPTION_KEY: ${INFISICAL_ENCRYPTION_KEY:-change-me}
      AUTH_SECRET: ${INFISICAL_AUTH_SECRET:-change-me}
      DB_CONNECTION_URI: postgresql://infisical:${INFISICAL_DB_PASSWORD:-change-me-infisical-db}@infisical-db:5432/infisical
      REDIS_URL: redis://redis:6379/1
      SITE_URL: ${INFISICAL_SITE_URL:-http://localhost:8085}
    ports:
      - '${LKM_INFISICAL_PORT:-8085}:8080'
    restart: ${LKM_RESTART_POLICY:-no}
    networks:
      - lkm

  postgres:
    # TimescaleDB 版 PG16 ：outbox_events/outbox_archived 是 hypertable，需该引擎
    # （官方镜像已配 shared_preload_libraries=timescaledb，扩展由 deploy/initdb 与应用侧
    # init_db 幂等补建）。仅主库换，prefect-postgres / infisical-db 仍是 postgres:16-alpine。
    # 从 postgres:16-alpine **就地换镜像**不会改动既有数据卷的 schema：hypertable 的
    # 主键必须含分区列 created_at，旧卷需重建（或手工迁移），见 DEPLOYMENT.md。
    image: timescale/timescaledb:latest-pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-lkm}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?生产需设置 POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-lkm}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # S5-A2 Step3：首启 initdb 补建独立 AUTH 库 lkm_auth(仅空数据卷首次执行)；只读挂载。
      - ./deploy/initdb:/docker-entrypoint-initdb.d:ro
    restart: ${LKM_RESTART_POLICY:-no}
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - lkm

  redis:
    image: redis:7-alpine
    command: ['redis-server', '--appendonly', 'yes']
    volumes:
      - redis_data:/data
    restart: ${LKM_RESTART_POLICY:-no}
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - lkm

  # Apache Pulsar：全站消息总线，standalone 自带 ZooKeeper + BookKeeper。
  # broker 6650 / Admin REST 8080 仅内网；backend 与各 worker 经 LKM_PULSAR_URL 连接。
  #
  # 无状态化（2026-09-17 根治，见路线图 §8 #32）：启动包装脚本每次清空数据目录 + broker 就绪后
  # 幂等重建租户/namespace。理由与代价（重启会丢「已发布未消费」窗口）写在
  # deploy/pulsar/entrypoint.sh 顶部——一句话：standalone 的 bookie 地址每次进程启动都变
  # （随机端口 + 容器 IP 变化），旧 ledger 必然不可读 → broker 崩溃循环 → 依赖它的 backend 与
  # 9 个 worker 全卡 Created（本机已复发三次，三条「钉住地址」的路实测均无效）。
  pulsar:
    image: apachepulsar/pulsar:3.3.0
    entrypoint: ['/bin/sh', '/pulsar-entrypoint.sh']
    environment:
      # standalone 内存受限，避免开发机/小主机被 OOM
      PULSAR_MEM: '-Xms512m -Xmx512m -XX:MaxDirectMemorySize=512m'
    volumes:
      - pulsar_data:/pulsar/data
      - ./deploy/pulsar/entrypoint.sh:/pulsar-entrypoint.sh:ro
    expose:
      - '6650'
      - '8080'
    healthcheck:
      # healthy = broker 就绪 **且** 初始化已完成（namespace 存在）。依赖方（backend/auth/worker）
      # 因此无需再等一次性 init 服务，也不会在 namespace 建好前抢跑订阅。
      # 注：`pulsar-admin` 是 JVM 客户端，单次调用实测 ~12s（本机负载下），故 timeout 必须放宽到
      # 25s、interval 30s；且 `namespaces list <tenant>` 输出带租户前缀（`lkm/biz`），grep 须带前缀。
      test:
        - 'CMD-SHELL'
        - 'bin/pulsar-admin --admin-url http://127.0.0.1:8080 namespaces list lkm 2>/dev/null | grep -qx "lkm/biz"'
      interval: 30s
      timeout: 25s
      retries: 6
      start_period: 90s
    restart: ${LKM_RESTART_POLICY:-no}
    networks:
      - lkm

  minio:
    image: minio/minio:latest
    command: ['server', '/data', '--console-address', ':9001']
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-lkmadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?生产需设置 MINIO_ROOT_PASSWORD}
    volumes:
      - minio_data:/data
    expose:
      - '9000'
      - '9001'
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:9000/minio/health/ready']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - lkm

  backend:
    build:
      context: ./LKM-service
      dockerfile: Dockerfile
    image: lkm-service:latest
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      pulsar:
        condition: service_healthy
    environment:
      LKM_ENV: production
      # 公网 Host 白名单：生产必填（缺则进程装配期 fail-fast）。内网服务名/回环
      # 必须列入，否则容器 healthcheck 直连 127.0.0.1 会被 TrustedHost 判 400 → 长期 unhealthy。
      # CORS 不在此下发：生产不挂应用层 CORS，唯一权威是 APISIX 的 cors 插件
      # （deploy/apisix/apisix.yaml），来源白名单在 render.sh 里由域名变量展开。
      LKM_ALLOWED_HOSTS: ${LKM_ALLOWED_HOSTS:-lkm-ahz.ltd,www.lkm-ahz.ltd,backend,auth,localhost,127.0.0.1}
      # 单文件上传上限：与网关 APISIX 的 max_body_size 同源（apisix-render 读同一个 env）
      LKM_MAX_UPLOAD_BYTES: ${LKM_MAX_UPLOAD_BYTES:-104857600}
      LKM_DB_HOST: postgres
      LKM_DB_PORT: 5432
      LKM_DB_NAME: ${POSTGRES_DB:-lkm}
      LKM_DB_USER: ${POSTGRES_USER:-lkm}
      LKM_DB_PASSWORD: ${POSTGRES_PASSWORD:?生产需设置 POSTGRES_PASSWORD}
      LKM_REDIS_URL: redis://redis:6379/0
      LKM_PULSAR_URL: pulsar://pulsar:6650
      # lag 上报（M4）：API 进程周期拉 Admin REST 统计订阅 msgBacklog → Prometheus
      LKM_PULSAR_ADMIN_URL: http://pulsar:8080
      # AUTH 内部读写缝：S5 拆库后 users/profiles 只在 auth 独立库，业务库无 users 表。
      # 未配齐（URL/token）→ seam 关闭，snapshot 回落业务库直查 users 会 UndefinedTable，
      # 身份展示读 + 考试解锁/项目升权写全线报错。故生产必须成对配置。
      LKM_AUTH_HTTP_URL: ${LKM_AUTH_HTTP_URL:-http://auth:8001}
      LKM_AUTH_HTTP_TOKEN: ${LKM_AUTH_HTTP_TOKEN:?生产需设置 LKM_AUTH_HTTP_TOKEN}
      # 多 worker：按压测基线调，默认单 worker；多核下水平跑满 CPU
      LKM_WEB_WORKERS: ${LKM_WEB_WORKERS:-1}
      LKM_BLOG_REPO_DIR: /data/blog_repos
      # 对象存储(MinIO)：文件/头像读写走 S3 后端
      LKM_STORAGE_BACKEND: s3
      LKM_S3_ENDPOINT_URL: http://minio:9000
      # 预签名直传/下载对浏览器暴露地址：MinIO 经 APISIX /lkm/ 转发，host 用站点公网地址
      LKM_S3_PUBLIC_ENDPOINT_URL: ${LKM_S3_PUBLIC_ENDPOINT_URL:-http://124.220.55.235}
      LKM_S3_BUCKET: ${LKM_S3_BUCKET:-lkm}
      LKM_S3_PREFIX: ${LKM_S3_PREFIX:-files}
      LKM_S3_ACCESS_KEY: ${MINIO_ROOT_USER:-lkmadmin}
      LKM_S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:?生产需设置 MINIO_ROOT_PASSWORD}
      # LKM_FILES_STORE_DIR 仅作迁移脚本参考；运行时对象存于 MinIO（本地路径可保留供迁移读取）
      LKM_FILES_STORE_DIR: /data/files_store
      LKM_JWT_SECRET: ${LKM_JWT_SECRET:?生产需设置 LKM_JWT_SECRET}
      LKM_TOTP_ENCRYPTION_KEY: ${LKM_TOTP_ENCRYPTION_KEY:?生产需设置 LKM_TOTP_ENCRYPTION_KEY}
      LKM_VERIFICATION_CODE_PEPPER: ${LKM_VERIFICATION_CODE_PEPPER:?生产需设置 LKM_VERIFICATION_CODE_PEPPER}
      # RS256/JWKS（批 5）：单体是**验签方**，只挂公钥（绝不下发私钥，否则可自造 token）。
      # 留空 → 沿用 HS256（`jwt_hs_fallback` 亦须为 true，否则 token 一律拒）。
      LKM_JWT_PUBLIC_KEY_FILE: ${LKM_JWT_PUBLIC_KEY_FILE:-}
      LKM_JWT_HS_FALLBACK: ${LKM_JWT_HS_FALLBACK:-true}
      LKM_GITHUB_CLIENT_ID: ${LKM_GITHUB_CLIENT_ID:-}
      LKM_GITHUB_CLIENT_SECRET: ${LKM_GITHUB_CLIENT_SECRET:-}
      LKM_RP_ID: 124.220.55.235
      LKM_ORIGIN: http://124.220.55.235
      LKM_GITHUB_REDIRECT_URI: http://124.220.55.235/api/v1/auth/oauth/github/callback
      LKM_FRONTEND_CALLBACK: http://124.220.55.235/login/success
      # 链路追踪：默认关；起 otel profile 并指 ENDPOINT 才生效
      LKM_OTEL_ENABLED: ${LKM_OTEL_ENABLED:-false}
      LKM_OTEL_EXPORTER_OTLP_ENDPOINT: ${LKM_OTEL_EXPORTER_OTLP_ENDPOINT:-}
      LKM_OTEL_SAMPLE_RATIO: ${LKM_OTEL_SAMPLE_RATIO:-0.1}
      # Infisical 密钥管理：默认关；起 infisical profile 并配齐 ID/secret 才拉取
      LKM_INFISICAL_ENABLED: ${LKM_INFISICAL_ENABLED:-false}
      LKM_INFISICAL_REQUIRED: ${LKM_INFISICAL_REQUIRED:-false}
      LKM_INFISICAL_SITE_URL: ${LKM_INFISICAL_SITE_URL:-http://infisical:8080}
      LKM_INFISICAL_PROJECT_ID: ${LKM_INFISICAL_PROJECT_ID:-}
      LKM_INFISICAL_ENVIRONMENT: ${LKM_INFISICAL_ENVIRONMENT:-prod}
      LKM_INFISICAL_SECRET_PATH: ${LKM_INFISICAL_SECRET_PATH:-/}
      LKM_INFISICAL_CLIENT_ID: ${LKM_INFISICAL_CLIENT_ID:-}
      LKM_INFISICAL_CLIENT_SECRET: ${LKM_INFISICAL_CLIENT_SECRET:-}
      # ClickHouse 分析库：backend 承载 admin 只读查询；默认关（查询端点 503）
      LKM_CLICKHOUSE_ENABLED: ${LKM_CLICKHOUSE_ENABLED:-false}
      LKM_CLICKHOUSE_URL: ${LKM_CLICKHOUSE_URL:-http://clickhouse:8123}
      LKM_CLICKHOUSE_DATABASE: ${LKM_CLICKHOUSE_DATABASE:-lkm}
      LKM_CLICKHOUSE_USER: ${CLICKHOUSE_USER:-lkm}
      LKM_CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-change-me-clickhouse}
    volumes:
      - backend_data:/data
      # RSA 公钥（只读）：单体只验签，故只挂公钥。
      - ./deploy/jwt/keys:/etc/lkm/jwt:ro
    restart: ${LKM_RESTART_POLICY:-no}
    healthcheck:
      # 打 /liveness（零外部依赖）：进程存活即心跳 OK。依赖是否就绪由 /readiness 表达
      # （未就绪返 503），避免 DB/Redis/Pulsar/AUTH 任一抖动就把容器判死重启。
      test:
        [
          'CMD',
          'python',
          '-c',
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/liveness', timeout=5)",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    networks:
      - lkm

  # AUTH 独立进程：与单体的 backend 同镜像(同代码库/同配置源)、异 command。
  # 跑只读/认证面 `auth.main:app`，自持 DB+Redis 依赖与专属 /liveness|/readiness 健康缝。
  # 纯增量、不改单体拓扑：仅内网暴露(无主机端口映射，B1.2 才由 APISIX 反代接出)。
  # healthcheck 打本进程自己的 /liveness：进程能应答即心跳 OK；依赖就绪由 below depends_on 判定。
  auth:
    image: lkm-service:latest
    command: ['python', '-m', 'auth.main']
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      LKM_ENV: production
      LKM_JWT_SECRET: ${LKM_JWT_SECRET:?生产需设置 LKM_JWT_SECRET}
      LKM_TOTP_ENCRYPTION_KEY: ${LKM_TOTP_ENCRYPTION_KEY:?生产需设置 LKM_TOTP_ENCRYPTION_KEY}
      LKM_VERIFICATION_CODE_PEPPER: ${LKM_VERIFICATION_CODE_PEPPER:?生产需设置 LKM_VERIFICATION_CODE_PEPPER}
      # RS256/JWKS（批 5）：AUTH 是**签发方**，持私钥；公钥同时下发供 JWKS 端点发布。
      # 两处留空 → 沿用 HS256。`LKM_JWT_HS_FALLBACK=false` 即「关 HS」的最终切换开关
      # （批 1 已重建库、无存量 token，可直接关）。
      LKM_JWT_PRIVATE_KEY_FILE: ${LKM_JWT_PRIVATE_KEY_FILE:-}
      LKM_JWT_PUBLIC_KEY_FILE: ${LKM_JWT_PUBLIC_KEY_FILE:-}
      LKM_JWT_HS_FALLBACK: ${LKM_JWT_HS_FALLBACK:-true}
      # 公网 Host 白名单：与 backend 同值；auth 亦承载对外认证面。
      # CORS 同 backend：生产唯一权威是 APISIX，不在此下发。
      LKM_ALLOWED_HOSTS: ${LKM_ALLOWED_HOSTS:-lkm-ahz.ltd,www.lkm-ahz.ltd,backend,auth,localhost,127.0.0.1}
      LKM_REDIS_URL: redis://redis:6379/0
      LKM_PULSAR_URL: pulsar://pulsar:6650
      LKM_DB_HOST: postgres
      LKM_DB_PORT: 5432
      LKM_DB_NAME: ${POSTGRES_DB:-lkm}
      LKM_DB_USER: ${POSTGRES_USER:-lkm}
      LKM_DB_PASSWORD: ${POSTGRES_PASSWORD:?生产需设置 POSTGRES_PASSWORD}
      # auth 域专属自足 DB → 独立 auth 库（真拆库：统一 PG），由首启 initdb 建出、
      # owner=同 POSTGRES_USER，auth_session 直连 lkm_auth；与上面 LKM_DB_*(=biz lkm)解耦。
      LKM_AUTH_DB_HOST: postgres
      LKM_AUTH_DB_PORT: 5432
      LKM_AUTH_DB_NAME: ${LKM_AUTH_DB:-lkm_auth}
      LKM_AUTH_DB_USER: ${POSTGRES_USER:-lkm}
      LKM_AUTH_DB_PASSWORD: ${POSTGRES_PASSWORD:?生产需设置 POSTGRES_PASSWORD}
      # AUTH 进程须持有同一内部缝 token 以校验 backend 的 Bearer（router_read/router_authz
      # 的 _require_internal_token）；不设 URL 避免本进程 snapshot 自打自的回路。
      LKM_AUTH_HTTP_TOKEN: ${LKM_AUTH_HTTP_TOKEN:?生产需设置 LKM_AUTH_HTTP_TOKEN}
      LKM_RP_ID: ${LKM_RP_ID:-124.220.55.235}
      # 链路追踪：auth 进程独立 service.name 后缀 -auth
      LKM_OTEL_ENABLED: ${LKM_OTEL_ENABLED:-false}
      LKM_OTEL_EXPORTER_OTLP_ENDPOINT: ${LKM_OTEL_EXPORTER_OTLP_ENDPOINT:-}
      LKM_OTEL_SAMPLE_RATIO: ${LKM_OTEL_SAMPLE_RATIO:-0.1}
      # Infisical 密钥管理：auth 进程同样启动前拉取
      LKM_INFISICAL_ENABLED: ${LKM_INFISICAL_ENABLED:-false}
      LKM_INFISICAL_REQUIRED: ${LKM_INFISICAL_REQUIRED:-false}
      LKM_INFISICAL_SITE_URL: ${LKM_INFISICAL_SITE_URL:-http://infisical:8080}
      LKM_INFISICAL_PROJECT_ID: ${LKM_INFISICAL_PROJECT_ID:-}
      LKM_INFISICAL_ENVIRONMENT: ${LKM_INFISICAL_ENVIRONMENT:-prod}
      LKM_INFISICAL_SECRET_PATH: ${LKM_INFISICAL_SECRET_PATH:-/}
      LKM_INFISICAL_CLIENT_ID: ${LKM_INFISICAL_CLIENT_ID:-}
      LKM_INFISICAL_CLIENT_SECRET: ${LKM_INFISICAL_CLIENT_SECRET:-}
    volumes:
      # 私钥 + 公钥（只读）：仅 auth 侧挂私钥，其余容器只挂同一目录里的公钥。
      - ./deploy/jwt/keys:/etc/lkm/jwt:ro
    restart: ${LKM_RESTART_POLICY:-no}
    healthcheck:
      test:
        [
          'CMD',
          'python',
          '-c',
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/liveness', timeout=5)",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      - lkm

  worker-send:
    image: lkm-service:latest
    command: ['python', '-m', 'app.core.worker_send']
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
      pulsar:
        condition: service_healthy
    environment:
      <<: *otel-env
      LKM_ENV: production
      LKM_JWT_SECRET: ${LKM_JWT_SECRET:?生产需设置 LKM_JWT_SECRET}
      LKM_TOTP_ENCRYPTION_KEY: ${LKM_TOTP_ENCRYPTION_KEY:?生产需设置 LKM_TOTP_ENCRYPTION_KEY}
      LKM_VERIFICATION_CODE_PEPPER: ${LKM_VERIFICATION_CODE_PEPPER:?生产需设置 LKM_VERIFICATION_CODE_PEPPER}
      LKM_REDIS_URL: redis://redis:6379/0
      LKM_PULSAR_URL: pulsar://pulsar:6650
      LKM_DB_HOST: postgres
      LKM_DB_PORT: 5432
      LKM_DB_NAME: ${POSTGRES_DB:-lkm}
      LKM_DB_USER: ${POSTGRES_USER:-lkm}
      LKM_DB_PASSWORD: ${POSTGRES_PASSWORD:?生产需设置 POSTGRES_PASSWORD}
    restart: ${LKM_RESTART_POLICY:-no}
    networks:
      - lkm

  worker:
    image: lkm-service:latest
    command: ['python', '-m', 'app.core.worker_default']
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
      pulsar:
        condition: service_healthy
    environment:
      <<: *otel-env
      LKM_ENV: production
      LKM_JWT_SECRET: ${LKM_JWT_SECRET:?生产需设置 LKM_JWT_SECRET}
      LKM_TOTP_ENCRYPTION_KEY: ${LKM_TOTP_ENCRYPTION_KEY:?生产需设置 LKM_TOTP_ENCRYPTION_KEY}
      LKM_VERIFICATION_CODE_PEPPER: ${LKM_VERIFICATION_CODE_PEPPER:?生产需设置 LKM_VERIFICATION_CODE_PEPPER}
      LKM_REDIS_URL: redis://redis:6379/0
      LKM_PULSAR_URL: pulsar://pulsar:6650
      LKM_DB_HOST: postgres
      LKM_DB_PORT: 5432
      LKM_DB_NAME: ${POSTGRES_DB:-lkm}
      LKM_DB_USER: ${POSTGRES_USER:-lkm}
      LKM_DB_PASSWORD: ${POSTGRES_PASSWORD:?生产需设置 POSTGRES_PASSWORD}
      LKM_BLOG_REPO_DIR: /data/blog_repos   # 与 backend 同卷同路径
      # jobs 消费者跑 user_dim 离线 ETL（auth.tasks）→ 需读 auth 库源（User/Profile），
      # 写业务库 user_dim（跨 realm 双会话）。
      LKM_AUTH_DB_HOST: postgres
      LKM_AUTH_DB_PORT: 5432
      LKM_AUTH_DB_NAME: ${LKM_AUTH_DB:-lkm_auth}
      LKM_AUTH_DB_USER: ${POSTGRES_USER:-lkm}
      LKM_AUTH_DB_PASSWORD: ${POSTGRES_PASSWORD:?生产需设置 POSTGRES_PASSWORD}
      # Prefect 编排：默认关。开启后 cron 对账改为触发 Prefect deployment，
      # 触发失败 fail-open 回落直调。需同时 `--profile prefect up -d` 起 server/worker。
      LKM_PREFECT_ENABLED: ${LKM_PREFECT_ENABLED:-false}
      LKM_PREFECT_API_URL: ${LKM_PREFECT_API_URL:-}
      LKM_PREFECT_DEPLOYMENT: ${LKM_PREFECT_DEPLOYMENT:-}
      LKM_PREFECT_ANALYTICS_DEPLOYMENT: ${LKM_PREFECT_ANALYTICS_DEPLOYMENT:-}
      LKM_PREFECT_API_TOKEN: ${LKM_PREFECT_API_TOKEN:-}
      # ClickHouse 分析管道：回落直调导出（auth.tasks → analytics_body）需连
      # CH；默认关则 no-op。触发成功时重活在 prefect-worker 内，此处仅回落路径用。
      LKM_CLICKHOUSE_ENABLED: ${LKM_CLICKHOUSE_ENABLED:-false}
      LKM_CLICKHOUSE_URL: ${LKM_CLICKHOUSE_URL:-http://clickhouse:8123}
      LKM_CLICKHOUSE_DATABASE: ${LKM_CLICKHOUSE_DATABASE:-lkm}
      LKM_CLICKHOUSE_USER: ${CLICKHOUSE_USER:-lkm}
      LKM_CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-change-me-clickhouse}
    volumes:
      - backend_data:/data
    restart: ${LKM_RESTART_POLICY:-no}
    networks:
      - lkm

  # points 三订阅扇出：同一 topic biz/points.apply 挂三个 Shared subscription，
  # 各由独立进程消费（reward / stats / tasks），真实故障隔离——停一个不影响其余。
  worker-points-reward:
    image: lkm-service:latest
    command: ['python', '-m', 'app.core.worker_points_reward']
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
      pulsar:
        condition: service_healthy
