# OpenTelemetry Collector（M5 7.2.2；批 6 接入 SigNoz）：接收应用 OTLP traces 后**双路出**——
# debug（本地观测，始终保留）与 otlphttp（转发给自托管 SigNoz 的 collector）。
#
# 链路：应用 → 本 collector → `signoz-otel-collector`（profile signoz）→ ClickHouse → SigNoz UI。
# `signoz-otel-collector` 同时挂在 lkm 网络，故此处按服务名直连。
#
# **未起 signoz profile 时**：otlphttp 连不上会在日志里重试报错、span 最终丢弃——这是刻意
# 保留的 fail-open，debug 输出与应用侧均不受影响。嫌吵可临时把 otlphttp 从下面 exporters
# 列表移除（或改用 `--profile otel --profile signoz` 一并起）。
receivers:
  otlp:
    protocols:
      http:
        endpoint: 0.0.0.0:4318
      grpc:
        endpoint: 0.0.0.0:4317

processors:
  batch: {}

exporters:
  debug:
    verbosity: normal
  # SigNoz OTLP/HTTP ingestion。collector 侧只收 span（traces 管线），
  # 故只需 traces 端点；路径由 exporter 自动拼 /v1/traces。
  otlphttp:
    endpoint: http://signoz-otel-collector:4318
    tls:
      insecure: true

service:
  # Collector 自身内部指标（含 otelcol_receiver_accepted_spans_total），供验收抓取
  telemetry:
    metrics:
      address: 0.0.0.0:8888
  pipelines:
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [debug, otlphttp]
