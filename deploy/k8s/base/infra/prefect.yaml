# Prefect 是 cron 唯一调度器，server / worker 必须常驻。
apiVersion: v1
kind: Service
metadata:
  name: prefect-postgres
  labels: &pg-labels
    app.kubernetes.io/name: prefect-postgres
    app.kubernetes.io/component: infra
    app.kubernetes.io/part-of: lkm
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: prefect-postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: prefect-postgres
  labels:
    app.kubernetes.io/name: prefect-postgres
    app.kubernetes.io/component: infra
    app.kubernetes.io/part-of: lkm
spec:
  serviceName: prefect-postgres
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: prefect-postgres
  template:
    metadata:
      labels:
        app.kubernetes.io/name: prefect-postgres
        app.kubernetes.io/component: infra
        app.kubernetes.io/part-of: lkm
    spec:
      securityContext:
        runAsUser: 0
        fsGroup: 70
      containers:
        - name: postgres
          image: postgres:16-alpine
          imagePullPolicy: IfNotPresent
          ports:
            - name: postgres
              containerPort: 5432
          env:
            - name: POSTGRES_USER
              value: prefect
            - name: POSTGRES_DB
              value: prefect
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef: { name: lkm-secrets, key: PREFECT_DB_PASSWORD }
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
          readinessProbe:
            exec:
              command: ['pg_isready', '-U', 'prefect', '-d', 'prefect']
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits: { memory: 512Mi }
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests:
            storage: 5Gi
---
apiVersion: v1
kind: Service
metadata:
  name: prefect-server
  labels: &srv-labels
    app.kubernetes.io/name: prefect-server
    app.kubernetes.io/component: orchestration
    app.kubernetes.io/part-of: lkm
spec:
  selector:
    app.kubernetes.io/name: prefect-server
  ports:
    - name: api
      port: 4200
      targetPort: api
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prefect-server
  labels:
    app.kubernetes.io/name: prefect-server
    app.kubernetes.io/component: orchestration
    app.kubernetes.io/part-of: lkm
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: prefect-server
  template:
    metadata:
      labels:
        app.kubernetes.io/name: prefect-server
        app.kubernetes.io/component: orchestration
        app.kubernetes.io/part-of: lkm
    spec:
      containers:
        - name: prefect-server
          image: lkm-service:latest
          imagePullPolicy: IfNotPresent
          command: ['prefect', 'server', 'start', '--host', '0.0.0.0']
          ports:
            - name: api
              containerPort: 4200
          env:
            # 顺序有要求：k8s 只展开**先于自身声明**的 $(VAR)，故密码必须排在连接串之前
            - name: PREFECT_DB_PASSWORD
              valueFrom:
                secretKeyRef: { name: lkm-secrets, key: PREFECT_DB_PASSWORD }
            - name: PREFECT_API_DATABASE_CONNECTION_URL
              value: postgresql+asyncpg://prefect:$(PREFECT_DB_PASSWORD)@prefect-postgres:5432/prefect
            - name: LKM_INFISICAL_ENABLED
              valueFrom:
                configMapKeyRef: { name: lkm-config, key: LKM_INFISICAL_ENABLED }
          readinessProbe:
            httpGet: { path: /api/health, port: api }
            initialDelaySeconds: 10
            periodSeconds: 15
            failureThreshold: 10
          startupProbe:
            httpGet: { path: /api/health, port: api }
            periodSeconds: 5
            failureThreshold: 60
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { memory: 1Gi }
---
# process 型 work pool：flow 在 worker 容器内以本地源码执行，复用 lkm-service 镜像。
# 环境集比照 jobs worker，包含 Pulsar 和 Prefect API。
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prefect-worker
  labels:
    app.kubernetes.io/name: prefect-worker
    app.kubernetes.io/component: orchestration
    app.kubernetes.io/part-of: lkm
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: prefect-worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: prefect-worker
        app.kubernetes.io/component: orchestration
        app.kubernetes.io/part-of: lkm
    spec:
      containers:
        - name: prefect-worker
          image: lkm-service:latest
          imagePullPolicy: IfNotPresent
          command: ['sh', '-c']
          args:
            - |
              prefect work-pool create "$LKM_PREFECT_WORK_POOL" --type process || true
              python -m boot.flows_deploy && exec prefect worker start --pool "$LKM_PREFECT_WORK_POOL" --type process
          envFrom:
            - configMapRef: { name: lkm-config }
            - configMapRef: { name: lkm-config-authdb }
            - configMapRef: { name: lkm-config-analytics }
            - secretRef: { name: lkm-secrets }
          resources:
            requests: { cpu: 100m, memory: 512Mi }
            limits: { memory: 2Gi }
