# Redis：leader 租约（M1.2）、共享限流、L2 缓存。**硬依赖**——
# /readiness 在 Redis 不可达时返 503（M6.2 口径：L2 缺失即无一致性锚点）。
# AOF 已开（compose 同款 appendonly yes）：内容是「可重建但重建有代价」的租约与限流状态，
# 丢卷会让 outbox 租约瞬时失效、限流计数清零，故仍持久化。
apiVersion: v1
kind: Service
metadata:
  name: redis
  labels: &labels
    app.kubernetes.io/name: redis
    app.kubernetes.io/component: infra
    app.kubernetes.io/part-of: lkm
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: redis
  ports:
    - name: redis
      port: 6379
      targetPort: redis
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: redis
  labels:
    app.kubernetes.io/name: redis
    app.kubernetes.io/component: infra
    app.kubernetes.io/part-of: lkm
spec:
  serviceName: redis
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: redis
  template:
    metadata:
      labels:
        app.kubernetes.io/name: redis
        app.kubernetes.io/component: infra
        app.kubernetes.io/part-of: lkm
    spec:
      securityContext:
        runAsUser: 0
        fsGroup: 999
      containers:
        - name: redis
          image: redis:7-alpine
          imagePullPolicy: IfNotPresent
          args: ['redis-server', '--appendonly', 'yes', '--dir', '/data']
          ports:
            - name: redis
              containerPort: 6379
          volumeMounts:
            - name: data
              mountPath: /data
          readinessProbe:
            exec:
              command: ['redis-cli', 'ping']
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            exec:
              command: ['redis-cli', 'ping']
            periodSeconds: 20
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits: { memory: 512Mi }
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests:
            storage: 2Gi
