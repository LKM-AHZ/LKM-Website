# Redis：leader 租约（M1.2）、共享限流、L2 缓存。**硬依赖**——
# /readiness 在 Redis 不可达时返 503（M6.2 口径：L2 缺失即无一致性锚点）。
# **不持久化**（`--save '' --appendonly no`，与 compose、Dragonfly 后端完全对齐）：
# 原先靠 AOF 兜底的租约 / 限流计数已改为不依赖持久化——租约短 TTL 自愈、限流 fail-open、
# admin 单设备撤销落 DB 表（`revoked_access_tokens`）。重启即空属预期，见 DEPLOYMENT.md
# 「八·一、切换 L2 后端」。
apiVersion: v1
kind: Service
metadata:
  name: redis
  labels: &labels
    app.kubernetes.io/name: redis
    app.kubernetes.io/component: infra
    app.kubernetes.io/part-of: lkm
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: redis
  ports:
    - name: redis
      port: 6379
      targetPort: redis
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: redis
  labels:
    app.kubernetes.io/name: redis
    app.kubernetes.io/component: infra
    app.kubernetes.io/part-of: lkm
spec:
  serviceName: redis
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: redis
  template:
    metadata:
      labels:
        app.kubernetes.io/name: redis
        app.kubernetes.io/component: infra
        app.kubernetes.io/part-of: lkm
    spec:
      securityContext:
        runAsUser: 0
        fsGroup: 999
      containers:
        - name: redis
          image: redis:7-alpine
          imagePullPolicy: IfNotPresent
          args: ['redis-server', '--save', '', '--appendonly', 'no', '--dir', '/data']
          ports:
            - name: redis
              containerPort: 6379
          volumeMounts:
            - name: data
              mountPath: /data
          readinessProbe:
            exec:
              command: ['redis-cli', 'ping']
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            exec:
              command: ['redis-cli', 'ping']
            periodSeconds: 20
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits: { memory: 512Mi }
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests:
            storage: 2Gi
