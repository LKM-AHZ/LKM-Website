# Grafana（M6.12）：预置数据源与「LKM 后端总览」面板。
#
# 与 compose 共用同一批 provisioning/面板文件（configMapGenerator 直接引用）。
# **可选组件**：副本数控制开关（默认 0 = 不部署）。数据源指向集群内的 prometheus
# Service（FQDN，CoreDNS 不补 search domain）。
#
# 管理员密码：默认 admin（仅本地/内网使用时够用）；生产应在 gen-secret.sh 生成的
# Secret 里给 GF_SECURITY_ADMIN_PASSWORD 并挂为 env（见 README 差异表）。
apiVersion: v1
kind: Service
metadata:
  name: grafana
  labels:
    app.kubernetes.io/name: grafana
    app.kubernetes.io/component: observability
    app.kubernetes.io/part-of: lkm
spec:
  selector:
    app.kubernetes.io/name: grafana
  ports:
    - name: http
      port: 3000
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  labels:
    app.kubernetes.io/name: grafana
    app.kubernetes.io/component: observability
    app.kubernetes.io/part-of: lkm
spec:
  replicas: 0 # 可选组件：需要时改 1（compose 侧对应 --profile monitoring）
  selector:
    matchLabels:
      app.kubernetes.io/name: grafana
  template:
    metadata:
      labels:
        app.kubernetes.io/name: grafana
        app.kubernetes.io/component: observability
        app.kubernetes.io/part-of: lkm
    spec:
      containers:
        - name: grafana
          image: grafana/grafana:11.2.0
          imagePullPolicy: IfNotPresent
          env:
            - name: GF_SECURITY_ADMIN_PASSWORD
              value: admin
            - name: GF_USERS_ALLOW_SIGN_UP
              value: "false"
          # 数据源 URL 在 provisioning 文件里写的是短名 `prometheus:9090`（与 compose
          # 共用一份，见 deploy/grafana/provisioning/datasources/prometheus.yml）；
          # k8s 下靠容器 /etc/resolv.conf 的 search 域解析，故此处不做替换。
          # 若实测解析失败，改为在 overlay 里给 Grafana 单独的 datasource configMap。
          ports:
            - name: http
              containerPort: 3000
          volumeMounts:
            - name: provisioning-datasources
              mountPath: /etc/grafana/provisioning/datasources/prometheus.yml
              subPath: prometheus.yml
              readOnly: true
            - name: provisioning-dashboards
              mountPath: /etc/grafana/provisioning/dashboards/lkm.yml
              subPath: lkm.yml
              readOnly: true
            - name: dashboards
              mountPath: /var/lib/grafana/dashboards/lkm-overview.json
              subPath: lkm-overview.json
              readOnly: true
            - name: data
              mountPath: /var/lib/grafana
          readinessProbe:
            httpGet: { path: /api/health, port: http }
            initialDelaySeconds: 10
            periodSeconds: 15
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits: { memory: 512Mi }
      volumes:
        - name: provisioning-datasources
          configMap:
            name: grafana-provisioning-datasources
        - name: provisioning-dashboards
          configMap:
            name: grafana-provisioning-dashboards
        - name: dashboards
          configMap:
            name: grafana-dashboards
        - name: data
          emptyDir: {}
