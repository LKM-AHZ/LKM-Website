# MinIO：S3 兼容对象存储（文件库文件 + 成员头像）。仅集群内可见，
# 浏览器侧经 APISIX `/lkm/` 路径转发（预签名 URL 的 host 由网关改写成公网站点域名）。
apiVersion: v1
kind: Service
metadata:
  name: minio
  labels: &labels
    app.kubernetes.io/name: minio
    app.kubernetes.io/component: infra
    app.kubernetes.io/part-of: lkm
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: minio
  ports:
    - name: s3
      port: 9000
      targetPort: s3
    - name: console
      port: 9001
      targetPort: console
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: minio
  labels:
    app.kubernetes.io/name: minio
    app.kubernetes.io/component: infra
    app.kubernetes.io/part-of: lkm
spec:
  serviceName: minio
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: minio
  template:
    metadata:
      labels:
        app.kubernetes.io/name: minio
        app.kubernetes.io/component: infra
        app.kubernetes.io/part-of: lkm
    spec:
      containers:
        - name: minio
          image: minio/minio:latest
          imagePullPolicy: IfNotPresent
          args: ['server', '/data', '--console-address', ':9001']
          ports:
            - name: s3
              containerPort: 9000
            - name: console
              containerPort: 9001
          env:
            - name: MINIO_ROOT_USER
              valueFrom:
                secretKeyRef: { name: lkm-secrets, key: MINIO_ROOT_USER }
            - name: MINIO_ROOT_PASSWORD
              valueFrom:
                secretKeyRef: { name: lkm-secrets, key: MINIO_ROOT_PASSWORD }
          volumeMounts:
            - name: data
              mountPath: /data
          readinessProbe:
            httpGet: { path: /minio/health/ready, port: s3 }
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /minio/health/live, port: s3 }
            periodSeconds: 20
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { memory: 1Gi }
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests:
            storage: 20Gi
---
# 建桶（必做）：MinIO 不自动创建桶，**后端 S3 存储层不会代建**——
# 缺桶时文件库上传与头像读写全部 404/失败，且应用日志只会报 S3 NoSuchBucket。
# 幂等（--ignore-existing），可重复 apply。
apiVersion: batch/v1
kind: Job
metadata:
  name: minio-init
  labels:
    app.kubernetes.io/name: minio-init
    app.kubernetes.io/component: infra
    app.kubernetes.io/part-of: lkm
spec:
  backoffLimit: 20
  template:
    metadata:
      labels:
        app.kubernetes.io/name: minio-init
        app.kubernetes.io/part-of: lkm
    spec:
      restartPolicy: OnFailure
      containers:
        - name: minio-init
          image: minio/minio:latest
          imagePullPolicy: IfNotPresent
          command: ['/bin/sh', '-c']
          args:
            - |
              set -e
              for i in $(seq 1 60); do
                if mc alias set local http://minio:9000 "$MINIO_ROOT_USER" "$MINIO_ROOT_PASSWORD" >/dev/null 2>&1; then
                  break
                fi
                echo "waiting for minio... ($i/60)"
                sleep 5
              done
              mc mb --ignore-existing "local/${LKM_S3_BUCKET}"
              mc ls local
          env:
            - name: MINIO_ROOT_USER
              valueFrom:
                secretKeyRef: { name: lkm-secrets, key: MINIO_ROOT_USER }
            - name: MINIO_ROOT_PASSWORD
              valueFrom:
                secretKeyRef: { name: lkm-secrets, key: MINIO_ROOT_PASSWORD }
            # 桶名与后端 LKM_S3_BUCKET 同源（都来自 lkm-config），避免两处手改导致对不上
            - name: LKM_S3_BUCKET
              valueFrom:
                configMapKeyRef: { name: lkm-config, key: LKM_S3_BUCKET }
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { memory: 256Mi }
