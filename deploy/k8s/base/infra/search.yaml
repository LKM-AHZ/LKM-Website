# 检索引擎（B2）：Meilisearch（P2）/ OpenSearch（P3）。
#
# **可选组件**：按本仓既定约定用 `replicas: 0` 表「默认不部署」（compose 侧用 `--profile
# search`）。启用时：①把对应 StatefulSet 的 replicas 改 1；②app-config 里设
# LKM_SEARCH_ENGINE 与 URL；③Meilisearch 需先在 .env 补 LKM_SEARCH_MEILI_API_KEY 并重跑
# gen-secret.sh（Secret 键缺失时此处 optional=true，Pod 会以空 master key 启动失败）。
---
apiVersion: v1
kind: Service
metadata:
  name: meilisearch
  labels: &meili_labels
    app.kubernetes.io/name: meilisearch
    app.kubernetes.io/component: infra
    app.kubernetes.io/part-of: lkm
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: meilisearch
  ports:
    - name: http
      port: 7700
      targetPort: http
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: meilisearch
  labels:
    app.kubernetes.io/name: meilisearch
    app.kubernetes.io/component: infra
    app.kubernetes.io/part-of: lkm
spec:
  serviceName: meilisearch
  replicas: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: meilisearch
  template:
    metadata:
      labels:
        app.kubernetes.io/name: meilisearch
        app.kubernetes.io/component: infra
        app.kubernetes.io/part-of: lkm
    spec:
      containers:
        - name: meilisearch
          image: getmeili/meilisearch:v1.11
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 7700
          env:
            - name: MEILI_ENV
              value: production
            - name: MEILI_NO_ANALYTICS
              value: "true"
            - name: MEILI_MASTER_KEY
              valueFrom:
                secretKeyRef:
                  name: lkm-secrets
                  key: SEARCH_MEILI_API_KEY
                  optional: true
          volumeMounts:
            - name: data
              mountPath: /meili_data
          readinessProbe:
            httpGet: { path: /health, port: http }
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /health, port: http }
            periodSeconds: 30
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { memory: 1Gi }
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests:
            storage: 10Gi
---
apiVersion: v1
kind: Service
metadata:
  name: opensearch
  labels: &os_labels
    app.kubernetes.io/name: opensearch
    app.kubernetes.io/component: infra
    app.kubernetes.io/part-of: lkm
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: opensearch
  ports:
    - name: http
      port: 9200
      targetPort: http
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: opensearch
  labels:
    app.kubernetes.io/name: opensearch
    app.kubernetes.io/component: infra
    app.kubernetes.io/part-of: lkm
spec:
  serviceName: opensearch
  replicas: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: opensearch
  template:
    metadata:
      labels:
        app.kubernetes.io/name: opensearch
        app.kubernetes.io/component: infra
        app.kubernetes.io/part-of: lkm
    spec:
      containers:
        - name: opensearch
          image: opensearchproject/opensearch:2.17.1
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 9200
          env:
            - name: discovery.type
              value: single-node
            # 与 compose 同款：内网部署关闭安全插件（无鉴权）。生产应改走受信网段/网关鉴权。
            - name: DISABLE_SECURITY_PLUGIN
              value: "true"
            - name: DISABLE_INSTALL_DEMO_CONFIG
              value: "true"
            - name: OPENSEARCH_JAVA_OPTS
              value: -Xms512m -Xmx512m
          volumeMounts:
            - name: data
              mountPath: /usr/share/opensearch/data
          readinessProbe:
            httpGet: { path: /_cluster/health, port: http }
            initialDelaySeconds: 20
            periodSeconds: 10
          # OpenSearch 冷启动慢，用 startup 探针扛住，避免 liveness 误杀
          startupProbe:
            httpGet: { path: /_cluster/health, port: http }
            periodSeconds: 5
            failureThreshold: 60
          livenessProbe:
            httpGet: { path: /_cluster/health, port: http }
            periodSeconds: 30
          resources:
            requests: { cpu: 500m, memory: 1Gi }
            limits: { memory: 2Gi }
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests:
            storage: 20Gi
