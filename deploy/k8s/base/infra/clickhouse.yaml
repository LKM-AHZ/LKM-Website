# ClickHouse 分析库（M5 7.2.6）：app_logs（vector 采集）+ event_failures/audit_logs
# （Prefect flow 周期增量导出）。DDL 由挂载的 init.sql 在**数据目录首启**执行。
#
# 表结构/TTL 变更须重建 PVC 或手动 ALTER——与 compose「改 init.sql 需 down -v」同款约束。
apiVersion: v1
kind: Service
metadata:
  name: clickhouse
  labels: &labels
    app.kubernetes.io/name: clickhouse
    app.kubernetes.io/component: infra
    app.kubernetes.io/part-of: lkm
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: clickhouse
  ports:
    - name: http
      port: 8123
      targetPort: http
    - name: native
      port: 9000
      targetPort: native
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: clickhouse
  labels:
    app.kubernetes.io/name: clickhouse
    app.kubernetes.io/component: infra
    app.kubernetes.io/part-of: lkm
spec:
  serviceName: clickhouse
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: clickhouse
  template:
    metadata:
      labels:
        app.kubernetes.io/name: clickhouse
        app.kubernetes.io/component: infra
        app.kubernetes.io/part-of: lkm
    spec:
      securityContext:
        runAsUser: 0
        fsGroup: 101
      containers:
        - name: clickhouse
          image: clickhouse/clickhouse-server:24.8-alpine
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8123
            - name: native
              containerPort: 9000
          env:
            - name: CLICKHOUSE_USER
              valueFrom:
                secretKeyRef: { name: lkm-secrets, key: CLICKHOUSE_USER }
            - name: CLICKHOUSE_PASSWORD
              valueFrom:
                secretKeyRef: { name: lkm-secrets, key: CLICKHOUSE_PASSWORD }
            - name: CLICKHOUSE_DB
              value: lkm
            - name: CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT
              value: "1"
          volumeMounts:
            - name: data
              mountPath: /var/lib/clickhouse
            - name: initdb
              mountPath: /docker-entrypoint-initdb.d
              readOnly: true
          readinessProbe:
            httpGet: { path: /ping, port: http }
            initialDelaySeconds: 10
            periodSeconds: 10
          # CH 冷启动（建库建表）明显慢于普通服务；用 startup 探针扛住，避免 liveness 误杀
          startupProbe:
            httpGet: { path: /ping, port: http }
            periodSeconds: 5
            failureThreshold: 60
          livenessProbe:
            httpGet: { path: /ping, port: http }
            periodSeconds: 30
          resources:
            requests: { cpu: 200m, memory: 512Mi }
            limits: { memory: 2Gi }
          # 注：compose 侧设了 nofile ulimit 262144。k8s 无对应字段（需 containerd 层
          # 或 sysctl 配合），此处未设——CH 会打 max_open_files 警告但不影响功能；
          # 若真实负载下出现 "Too many open files"，再经 kubelet 的容器运行时配置抬高。
      volumes:
        - name: initdb
          configMap:
            name: clickhouse-initdb
            defaultMode: 0755
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests:
            storage: 20Gi
