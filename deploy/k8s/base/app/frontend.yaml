# 前端：astro（SSR）+ static（纯静态官网）。
# 两者都不直接对外——唯一对外入口是 APISIX，由它按 Host/路径分流。
---
apiVersion: v1
kind: Service
metadata:
  name: astro
  labels:
    app.kubernetes.io/name: astro
    app.kubernetes.io/component: frontend
    app.kubernetes.io/part-of: lkm
spec:
  selector:
    app.kubernetes.io/name: astro
  ports:
    - name: http
      port: 4321
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: astro
  labels:
    app.kubernetes.io/name: astro
    app.kubernetes.io/component: frontend
    app.kubernetes.io/part-of: lkm
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: astro
  template:
    metadata:
      labels:
        app.kubernetes.io/name: astro
        app.kubernetes.io/component: frontend
        app.kubernetes.io/part-of: lkm
    spec:
      containers:
        - name: astro
          image: lkm-official-website:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 4321
          env:
            - name: NODE_ENV
              value: production
            - name: HOST
              value: 0.0.0.0
            - name: PORT
              value: "4321"
            # SSR 服务端直连集群内 backend（不经网关，省一跳）
            - name: API_URL
              value: http://backend:8000
            # 浏览器侧可见的站点地址：域名在 overlay 覆盖
            - name: PUBLIC_SITE_URL
              value: https://lkm-ahz.ltd
          readinessProbe:
            exec:
              command: ['wget', '-qO-', 'http://127.0.0.1:4321/robots.txt']
            initialDelaySeconds: 5
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            exec:
              command: ['wget', '-qO-', 'http://127.0.0.1:4321/robots.txt']
            periodSeconds: 60
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { memory: 1Gi }
---
apiVersion: v1
kind: Service
metadata:
  name: static
  labels:
    app.kubernetes.io/name: static
    app.kubernetes.io/component: frontend
    app.kubernetes.io/part-of: lkm
spec:
  selector:
    app.kubernetes.io/name: static
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: static
  labels:
    app.kubernetes.io/name: static
    app.kubernetes.io/component: frontend
    app.kubernetes.io/part-of: lkm
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: static
  template:
    metadata:
      labels:
        app.kubernetes.io/name: static
        app.kubernetes.io/component: frontend
        app.kubernetes.io/part-of: lkm
    spec:
      containers:
        - name: static
          image: lkm-official-static:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 80
          readinessProbe:
            httpGet: { path: /, port: http }
            initialDelaySeconds: 3
            periodSeconds: 30
          resources:
            requests: { cpu: 20m, memory: 32Mi }
            limits: { memory: 128Mi }
