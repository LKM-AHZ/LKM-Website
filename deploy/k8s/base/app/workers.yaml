# 9 个常驻消费者 worker：与 backend/auth 同镜像，仅 entrypoint 不同。
# 每个进程常驻消费一个 Pulsar 订阅（消费失败重投超限后进 system/dlq，由 worker-dlq 落库）。
#
# 为什么都不设探针：这些进程的 PID 1 就是 python 本体，进程崩了容器即退出、由
# restartPolicy 拉起——探针能表达的语义已被退出码覆盖。而「消费卡住但进程还在」这类
# 故障，readiness/liveness 都探不出来（没有可断言的 HTTP 语义），compose 侧同样没有
# healthcheck。真正的兜底是 outbox 积压指标与 Pulsar lag 上报（M-OBS）。
---
# jobs 消费者：跑 user_dim 离线 ETL（auth.tasks），需读 auth 库源、写业务库 user_dim
# （跨 realm 双会话），并承载 Prefect 触发（触发失败 fail-open 回落直调）。
apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
  labels: &labels
    app.kubernetes.io/name: worker
    app.kubernetes.io/component: worker
    app.kubernetes.io/part-of: lkm
spec:
  replicas: 1
  strategy: { type: Recreate }
  selector:
    matchLabels:
      app.kubernetes.io/name: worker
  template:
    metadata:
      labels: *labels
    spec:
      containers:
        - name: worker
          image: lkm-service:latest
          imagePullPolicy: IfNotPresent
          command: ['python', '-m', 'app.core.worker_default']
          envFrom:
            - configMapRef: { name: lkm-config }
            - configMapRef: { name: lkm-config-authdb }
            - configMapRef: { name: lkm-config-analytics }
            - secretRef: { name: lkm-secrets }
          volumeMounts:
            - name: data
              mountPath: /data
          resources:
            requests: { cpu: 100m, memory: 384Mi }
            limits: { memory: 1Gi }
      volumes:
        # 与 backend 同卷同路径（LKM_BLOG_REPO_DIR=/data/blog_repos）
        - name: data
          persistentVolumeClaim:
            claimName: lkm-backend-data
---
