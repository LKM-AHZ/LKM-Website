# outbox relay（M1）：Redis 租约选主 → 同一时刻仅一个实例扫描并投递 outbox_events。
# **可安全扩副本**（多副本会自动一主多从，从者不轮询、不占 DB），但要看得见选主状态；
# 基础档保持 1 副本，与 compose 一致。
apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker-outbox
  labels:
    app.kubernetes.io/name: worker-outbox
    app.kubernetes.io/component: worker
    app.kubernetes.io/part-of: lkm
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: worker-outbox
  template:
    metadata:
      labels:
        app.kubernetes.io/name: worker-outbox
        app.kubernetes.io/component: worker
        app.kubernetes.io/part-of: lkm
    spec:
      containers:
        - name: worker-outbox
          image: lkm-service:latest
          imagePullPolicy: IfNotPresent
          command: ['python', '-m', 'app.core.worker_outbox']
          envFrom:
            - configMapRef: { name: lkm-config }
            - secretRef: { name: lkm-secrets }
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { memory: 512Mi }
---
# cron 触发发布（APScheduler 只做简单 cron 入口，复杂 DAG 交 Prefect）
apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker-scheduler
  labels:
    app.kubernetes.io/name: worker-scheduler
    app.kubernetes.io/component: worker
    app.kubernetes.io/part-of: lkm
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: worker-scheduler
  template:
    metadata:
      labels:
        app.kubernetes.io/name: worker-scheduler
        app.kubernetes.io/component: worker
        app.kubernetes.io/part-of: lkm
    spec:
      containers:
        - name: worker-scheduler
          image: lkm-service:latest
          imagePullPolicy: IfNotPresent
          command: ['python', '-m', 'app.core.worker_scheduler']
          # compose 只给它 ENV + 三主密钥 + PULSAR_URL（不接 DB/Redis）。此处用公共表会
          # 多下发 DB/Redis 等**它不消费**的键——多余但无害（不读就不会连），换来少维护
          # 一张专属表；若将来它真去连 DB 才能被发现，届时拆表。
          envFrom:
            - configMapRef: { name: lkm-config }
            - secretRef: { name: lkm-secrets }
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits: { memory: 256Mi }
---
# points 三订阅扇出（M4）：同一 topic biz/points.apply 挂三个 Shared subscription，
# 各由独立进程消费，真实故障隔离——停一个不影响其余。
# 三者共享 blog_repos 卷（与 backend 同路径）。
apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker-points-reward
  labels: &pts-labels
    app.kubernetes.io/component: worker
    app.kubernetes.io/part-of: lkm
spec:
  replicas: 1
