# AUTH 独立进程（B1.1）：与 backend 同镜像、异 entrypoint，跑 app.main_auth。
# 对外认证面经 APISIX 反代接出；集群内 8001。
#
# 它同时持有 biz 库与 auth 库两条连接：auth 域自足（LKM_AUTH_DB_*，users/profiles 的真身），
# 以及 backend 经 LKM_AUTH_HTTP_URL 打进来的内部读写缝（校验 LKM_AUTH_HTTP_TOKEN）。
apiVersion: v1
kind: Service
metadata:
  name: auth
  labels: &labels
    app.kubernetes.io/name: auth
    app.kubernetes.io/component: app
    app.kubernetes.io/part-of: lkm
spec:
  selector:
    app.kubernetes.io/name: auth
  ports:
    - name: http
      port: 8001
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth
  labels:
    app.kubernetes.io/name: auth
    app.kubernetes.io/component: app
    app.kubernetes.io/part-of: lkm
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: auth
  template:
    metadata:
      labels:
        app.kubernetes.io/name: auth
        app.kubernetes.io/component: app
        app.kubernetes.io/part-of: lkm
    spec:
      containers:
        - name: auth
          image: lkm-service:latest
          imagePullPolicy: IfNotPresent
          command: ['python', '-m', 'app.main_auth']
          ports:
            - name: http
              containerPort: 8001
          envFrom:
            - configMapRef: { name: lkm-config }
            - configMapRef: { name: lkm-config-authdb }
            - secretRef: { name: lkm-secrets }
            # RS256/JWKS（批 5）：私钥只下发到签发方 auth。optional=true —— 未生成
            # 密钥时该 Secret 不存在，Pod 仍应正常起（沿用 HS256），不能硬依赖。
            - secretRef: { name: lkm-jwt-signing, optional: true }
          # 与 backend 同款 exec 探针（原因见 backend.yaml 顶部注释：httpGet 的 Host 是 Pod IP，
          # 会被 TrustedHost 判 400）
          livenessProbe:
            exec:
              command:
                - python
                - -c
                - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/liveness', timeout=5)"
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            exec:
              command:
                - python
                - -c
                - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/readiness', timeout=5)"
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          startupProbe:
            exec:
              command:
                - python
                - -c
                - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/liveness', timeout=5)"
            periodSeconds: 5
            failureThreshold: 60
          resources:
            requests: { cpu: 150m, memory: 384Mi }
            limits: { memory: 1Gi }
