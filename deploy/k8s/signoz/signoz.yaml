# SigNoz 自托管工作负载（批 6）。与 docker-compose.yml 的 `profile: signoz` 逐服务对应：
#   signoz-init-clickhouse（Job）→ signoz-zookeeper（STS）→ signoz-clickhouse（STS）
#   → signoz-migrator（Job）→ signoz-otel-collector（Deploy）→ signoz（Deploy，UI）
#
# 全部 replicas: 0 —— 复用 prometheus/grafana 的「0 = 默认不启用」机制；apply 本目录后
# 需显式 scale（命令见 kustomization.yaml 头部）。Job 无 replicas，用 suspend: true 达到同样效果。
#
# 配置来源：ConfigMap（kustomization 的 configMapGenerator 引用仓库里的同一批文件）。
# 注意 otel-collector-config.yaml 里写死 `tcp://clickhouse:9000` —— 本 namespace 的
# ClickHouse Service 就叫 `clickhouse`，故无需改配置。
---
# ── ZooKeeper：官方 cluster.xml 写死主机名 zookeeper-1，故 Service 名即 zookeeper-1 ──
apiVersion: v1
kind: Service
metadata:
  name: zookeeper-1
  labels: &signoz-labels
    app.kubernetes.io/part-of: lkm
    app.kubernetes.io/component: signoz
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: signoz-zookeeper
  ports:
    - name: client
      port: 2181
      targetPort: client
    - name: metrics
      port: 9141
      targetPort: metrics
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: signoz-zookeeper
  labels:
    app.kubernetes.io/name: signoz-zookeeper
    app.kubernetes.io/part-of: lkm
    app.kubernetes.io/component: signoz
spec:
  serviceName: zookeeper-1
  replicas: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: signoz-zookeeper
  template:
    metadata:
      labels:
        app.kubernetes.io/name: signoz-zookeeper
    spec:
      # 官方镜像以非 root 跑但需要写数据目录，故置 root（与 compose 的 `user: root` 同）
      securityContext:
        runAsUser: 0
      containers:
        - name: zookeeper
          image: signoz/zookeeper:3.7.1
          env:
            - name: ZOO_SERVER_ID
              value: '1'
            - name: ALLOW_ANONYMOUS_LOGIN
              value: 'yes'
            - name: ZOO_AUTOPURGE_INTERVAL
              value: '1'
            - name: ZOO_ENABLE_PROMETHEUS_METRICS
              value: 'yes'
            - name: ZOO_PROMETHEUS_METRICS_PORT_NUMBER
              value: '9141'
          ports:
            - name: client
              containerPort: 2181
            - name: metrics
              containerPort: 9141
          readinessProbe:
            exec:
              command:
                - sh
                - -c
                - 'curl -s -m 2 http://localhost:8080/commands/ruok | grep error | grep null'
            initialDelaySeconds: 10
            periodSeconds: 30
            timeoutSeconds: 5
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { memory: 512Mi }
          volumeMounts:
            - name: data
              mountPath: /bitnami/zookeeper
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ['ReadWriteOnce']
        resources:
          requests:
            storage: 2Gi
---
# ── ClickHouse：官方配置写死 `clickhouse:9000` / `cluster` / 复制表，Service 名须为 clickhouse ──
apiVersion: v1
kind: Service
metadata:
  name: clickhouse
  labels:
    app.kubernetes.io/part-of: lkm
    app.kubernetes.io/component: signoz
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: signoz-clickhouse
  ports:
    - name: http
      port: 8123
      targetPort: http
    - name: native
      port: 9000
      targetPort: native
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: signoz-clickhouse
  labels:
    app.kubernetes.io/name: signoz-clickhouse
    app.kubernetes.io/part-of: lkm
    app.kubernetes.io/component: signoz
spec:
  serviceName: clickhouse
  replicas: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: signoz-clickhouse
  template:
    metadata:
      labels:
        app.kubernetes.io/name: signoz-clickhouse
    spec:
      # 官方 compose 给了 nproc/nofile 上限；k8s 无对应字段（见路线图 §8 #28 已知限制），
      # 只保留内存/CPU 约束。
      initContainers:
        # 与 compose 的 signoz-init-clickhouse 同职：把 histogramQuantile UDF 放进共享卷。
        # **需要出网**（GitHub Releases）；受限网络下会失败，此时 ClickHouse 仍能起，
        # 但用到该函数的查询会报函数缺失。
        - name: fetch-udf
          image: clickhouse/clickhouse-server:25.5.6
          command:
            - bash
            - -c
            - |
              set -e
              version="v0.0.1"
              node_os=$(uname -s | tr '[:upper:]' '[:lower:]')
              node_arch=$(uname -m | sed s/aarch64/arm64/ | sed s/x86_64/amd64/)
              cd /tmp
              wget -O histogram-quantile.tar.gz "https://github.com/SigNoz/signoz/releases/download/histogram-quantile%2F${version}/histogram-quantile_${node_os}_${node_arch}.tar.gz"
              tar -xvzf histogram-quantile.tar.gz
              mv histogram-quantile /var/lib/clickhouse/user_scripts/histogramQuantile
          volumeMounts:
            - name: scripts
              mountPath: /var/lib/clickhouse/user_scripts
      containers:
        - name: clickhouse
          image: clickhouse/clickhouse-server:25.5.6
          env:
            - name: CLICKHOUSE_SKIP_USER_SETUP
              value: '1'
          ports:
            - name: http
              containerPort: 8123
            - name: native
              containerPort: 9000
          readinessProbe:
            httpGet:
              path: /ping
              port: http
            initialDelaySeconds: 15
            periodSeconds: 30
            timeoutSeconds: 5
          resources:
            requests: { cpu: 500m, memory: 1Gi }
            limits: { memory: 4Gi }
          volumeMounts:
            - name: config
              mountPath: /etc/clickhouse-server/config.xml
              subPath: config.xml
              readOnly: true
            - name: config
              mountPath: /etc/clickhouse-server/users.xml
              subPath: users.xml
              readOnly: true
            - name: config
              mountPath: /etc/clickhouse-server/custom-function.xml
              subPath: custom-function.xml
              readOnly: true
            - name: config
              mountPath: /etc/clickhouse-server/config.d/cluster.xml
              subPath: cluster.xml
              readOnly: true
            - name: scripts
              mountPath: /var/lib/clickhouse/user_scripts
            - name: data
              mountPath: /var/lib/clickhouse
      volumes:
        - name: config
          configMap:
            name: signoz-clickhouse-config
        - name: scripts
          emptyDir: {}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ['ReadWriteOnce']
        resources:
          requests:
            storage: 20Gi
---
# ── 一次性：建库建表（bootstrap + sync up + async up）──
apiVersion: batch/v1
kind: Job
metadata:
  name: signoz-migrator
  labels:
    app.kubernetes.io/part-of: lkm
    app.kubernetes.io/component: signoz
spec:
  suspend: true # 同「replicas: 0 = 默认不启用」；启用时置 false 并删旧 Job（Job spec 不可变）
  backoffLimit: 3
  template:
    metadata:
      labels:
        app.kubernetes.io/name: signoz-migrator
    spec:
      restartPolicy: OnFailure
      containers:
        - name: migrator
          image: signoz/signoz-otel-collector:v0.144.5
          command: ['/bin/sh']
          args:
            - -c
            - |
              /signoz-otel-collector migrate bootstrap &&
              /signoz-otel-collector migrate sync up &&
              /signoz-otel-collector migrate async up
          env:
            - name: SIGNOZ_OTEL_COLLECTOR_CLICKHOUSE_DSN
              value: tcp://clickhouse:9000
            - name: SIGNOZ_OTEL_COLLECTOR_CLICKHOUSE_CLUSTER
              value: cluster
            - name: SIGNOZ_OTEL_COLLECTOR_CLICKHOUSE_REPLICATION
              value: 'true'
            - name: SIGNOZ_OTEL_COLLECTOR_TIMEOUT
              value: 10m
---
# ── OTel Collector：接收 OTLP 并写 ClickHouse ──
apiVersion: v1
kind: Service
metadata:
  name: signoz-otel-collector
  labels:
    app.kubernetes.io/part-of: lkm
    app.kubernetes.io/component: signoz
spec:
  selector:
    app.kubernetes.io/name: signoz-otel-collector
  ports:
    - name: otlp-grpc
      port: 4317
      targetPort: otlp-grpc
    - name: otlp-http
      port: 4318
      targetPort: otlp-http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: signoz-otel-collector
  labels:
    app.kubernetes.io/name: signoz-otel-collector
    app.kubernetes.io/part-of: lkm
    app.kubernetes.io/component: signoz
spec:
  replicas: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: signoz-otel-collector
  template:
    metadata:
      labels:
        app.kubernetes.io/name: signoz-otel-collector
    spec:
      containers:
        - name: collector
          image: signoz/signoz-otel-collector:v0.144.5
          command: ['/bin/sh']
          args:
            - -c
            - |
              /signoz-otel-collector migrate sync check &&
              /signoz-otel-collector --config=/etc/otel-collector-config.yaml --manager-config=/etc/manager-config.yaml --copy-path=/var/tmp/collector-config.yaml
          env:
            - name: OTEL_RESOURCE_ATTRIBUTES
              value: host.name=signoz-host,os.type=linux
            - name: LOW_CARDINAL_EXCEPTION_GROUPING
              value: 'false'
            - name: SIGNOZ_OTEL_COLLECTOR_CLICKHOUSE_DSN
              value: tcp://clickhouse:9000
            - name: SIGNOZ_OTEL_COLLECTOR_CLICKHOUSE_CLUSTER
              value: cluster
            - name: SIGNOZ_OTEL_COLLECTOR_CLICKHOUSE_REPLICATION
              value: 'true'
            - name: SIGNOZ_OTEL_COLLECTOR_TIMEOUT
              value: 10m
          ports:
            - name: otlp-grpc
              containerPort: 4317
            - name: otlp-http
              containerPort: 4318
          resources:
            requests: { cpu: 200m, memory: 512Mi }
            limits: { memory: 2Gi }
          volumeMounts:
            - name: otel-config
              mountPath: /etc/otel-collector-config.yaml
              subPath: otel-collector-config.yaml
              readOnly: true
            - name: otel-config
              mountPath: /etc/manager-config.yaml
              subPath: otel-collector-opamp-config.yaml
              readOnly: true
      volumes:
        - name: otel-config
          configMap:
            name: signoz-otel-config
---
# ── SigNoz UI/API ──
apiVersion: v1
kind: Service
metadata:
  name: signoz
  labels:
    app.kubernetes.io/part-of: lkm
    app.kubernetes.io/component: signoz
spec:
  selector:
    app.kubernetes.io/name: signoz
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: signoz
  labels:
    app.kubernetes.io/name: signoz
    app.kubernetes.io/part-of: lkm
    app.kubernetes.io/component: signoz
spec:
  replicas: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: signoz
  template:
    metadata:
      labels:
        app.kubernetes.io/name: signoz
    spec:
      containers:
        - name: signoz
          image: signoz/signoz:v0.128.0
          env:
            - name: SIGNOZ_ALERTMANAGER_PROVIDER
              value: signoz
            - name: SIGNOZ_TELEMETRYSTORE_CLICKHOUSE_DSN
              value: tcp://clickhouse:9000
            - name: SIGNOZ_SQLSTORE_SQLITE_PATH
              value: /var/lib/signoz/signoz.db
            # UI 自身会话签名密钥（非应用 JWT）。生产请改用 Secret 注入。
            - name: SIGNOZ_TOKENIZER_JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: lkm-secrets
                  key: LKM_JWT_SECRET
                  optional: true
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /api/v1/health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 30
            timeoutSeconds: 5
          resources:
            requests: { cpu: 200m, memory: 512Mi }
            limits: { memory: 2Gi }
          volumeMounts:
            - name: sqlite
              mountPath: /var/lib/signoz
      volumes:
        - name: sqlite
          emptyDir: {} # UI 会话/告警状态；与其他状态一样属可重建数据
