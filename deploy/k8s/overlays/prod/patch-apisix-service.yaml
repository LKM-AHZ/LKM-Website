# 云上把网关直接暴露成 LoadBalancer（拿到公网 IP，安全组放行 80/443）。
#
# 若前置了云 LB / Ingress，则改用 ClusterIP 并把证书交给 Ingress 或 cert-manager 终止；
# 此时 APISIX 侧可去掉 ssls 段（render.sh 在无证书时会渲染成空列表，不会报错）。
apiVersion: v1
kind: Service
metadata:
  name: apisix
  annotations:
    # 按云厂商调整；不支持的集群可整块删掉（只是拿不到额外参数）
    service.beta.kubernetes.io/aws-load-balancer-type: nlb
spec:
  type: LoadBalancer
