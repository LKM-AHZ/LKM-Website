# LKM 生产反向代理统一入口
# 双域名分流:
#   lkm-ahz.ltd / www.lkm-ahz.ltd  → 社区主站(SSR astro + 后端 API + MinIO)
#   lkm-ahz.icu / www.lkm-ahz.icu  → 纯静态官网(static 容器)
# 80:ACME http-01 challenge + 301 到 HTTPS;443:TLS 终止 + 分流
# 用 resolver(docker 内嵌 DNS)+ 变量形式 proxy_pass,使后端/前端域名在运行时动态解析:
# nginx 启动时不解析域名,避免启动期依赖 compose DNS;容器重启 IP 变化也能正确解析。
# 通用反代头抽到 proxy-common-headers.conf,经 include 复用。

resolver 127.0.0.11 valid=30s ipv6=off;

gzip on;
gzip_vary on;
gzip_min_length 1024;
gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss image/svg+xml;

# ---- 社区主站 80:ACME challenge + HTTPS 跳转 ----
server {
    listen 80;
    server_name lkm-ahz.ltd www.lkm-ahz.ltd;

    client_max_body_size 100m;

    # ACME http-01 challenge:certbot 写入 /var/www/certbot,续期时验证
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ---- 官网 80:ACME challenge + HTTPS 跳转 ----
server {
    listen 80;
    server_name lkm-ahz.icu www.lkm-ahz.icu;

    client_max_body_size 100m;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ---- 社区主站 443:TLS 终止 + 分流(默认入口) ----
server {
    listen 443 ssl;
    http2 on;
    server_name lkm-ahz.ltd www.lkm-ahz.ltd;

    ssl_certificate     /etc/letsencrypt/live/lkm-ahz.ltd/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/lkm-ahz.ltd/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    client_max_body_size 100m;

    # 上游(backend/astro)不可用时的统一错误页,避免暴露 nginx 原生错误页
    error_page 502 503 504 = @maintenance;
    location @maintenance {
        default_type application/json;
        return 502 '{"code":502,"msg":"服务暂时不可用,请稍后重试","data":null}';
    }

    # 指纹静态资源:长缓存(内容不可变,指纹资源)
    location /_astro/ {
        set $astro_upstream astro:4321;
        proxy_pass http://$astro_upstream;
        include proxy-common-headers.conf;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # ---- AUTH 认证面(/api/v1/auth/**:登录/2FA/OAuth/passkey/恢复/设置/内部读快照) → AUTH 独立进程 ----
    # M3 B1.3：auth 模块全程 owner-leaf、HTTP 面统一收敛在 /auth 前缀(见 auth-owner 路径清单)，
    # 故仅此最长前缀抢占自身路由即可外化；业务(/graphql、/api 其余、feed /users follow 等)仍走 backend。
    # 走 proxy_pass 无尾 URI → 原始 /api/v1/auth/... 原样送 auth:8001(auth ASGI 自带 api_prefix 装配)。
    # 部署开关：独立 auth 服务就绪后放开；若该服务不部署，注释本 location 即回落单体 backend
    # (backend 同码同样挂载这批 auth router)。nginx 不因本块声明任何对 auth 的启动硬依赖
    # (resolver 请求时解析,auth 不可达仅该面 5xx,不拖垮全站) → 就绪合并由 backend /health 自省。
    location ^~ /api/v1/auth/ {
        set $auth_upstream auth:8001;
        proxy_pass http://$auth_upstream;
        include proxy-common-headers.conf;
    }

    # ---- 后台 admin 会话写面(/api/v1/admin/auth/login|refresh|logout|2fa) → AUTH 独立进程 ----
    # S5-A2 Step3/B1.3 延伸：admin 4 会话写面也归 auth 进程 (modules/auth/admin_router,
    # prefix=/admin/auth,主进程 api_prefix=/api/v1 ⇒ /api/v1/admin/auth/*)。auth 库独立(lkm_auth)。
    # /me(读面,单体现行 admin/auth_router.py 保留,回链 biz 角色持仓)仍走 backend。
    # → 用两段区分：exact `= .../me` 送 backend(精确匹配优先于一切前缀)，prefix `/admin/auth/`
    #   承接其余 4 写面(login/refresh/logout/2fa)送 auth。nginx 精确匹配独立于顺序、天然最优先，
    #   prefix 块较长亦压过下方 generic `^~ /api/`。
    location = /api/v1/admin/auth/me {
        set $backend_upstream backend:8000;
        proxy_pass http://$backend_upstream;
        include proxy-common-headers.conf;
    }

    location ^~ /api/v1/admin/auth/ {
        set $auth_upstream auth:8001;
        proxy_pass http://$auth_upstream;
        include proxy-common-headers.conf;
    }

    # 成员头像 → 后端静态服务,immutable 长缓存(后端已返回该头,此处作双保险)
    location ^~ /static/avatars/ {
        set $backend_upstream backend:8000;
        proxy_pass http://$backend_upstream;
        include proxy-common-headers.conf;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # REST API → 后端
    location = /api {
        set $backend_upstream backend:8000;
        proxy_pass http://$backend_upstream;
        include proxy-common-headers.conf;
    }

    location ^~ /api/ {
        set $backend_upstream backend:8000;
        proxy_pass http://$backend_upstream;
        include proxy-common-headers.conf;
        # ^~ 阻断 regex;无斜杠 /api 由上面精确匹配处理,不落入 / 走 astro
    }

    # GraphQL → 后端,支持 WebSocket upgrade(subscription)
    location = /graphql {
        set $backend_upstream backend:8000;
        proxy_pass http://$backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        include proxy-common-headers.conf;
    }

    location ^~ /graphql/ {
        set $backend_upstream backend:8000;
        proxy_pass http://$backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        include proxy-common-headers.conf;
    }

    # MinIO 对象存储 → 经 nginx 转发（保留原始 path+query，避免破坏 S3 预签名）。
    # 预签名 URL 按 path-style 以 bucket 名(如 lkm)开头，故用 /lkm/ 前缀精确匹配。
    # $request_uri 保留签名所需的完整查询串(X-Amz-Signature 等)，否则 MinIO 校验失败返回 400。
    location ~ ^/lkm/ {
        set $minio_upstream minio:9000;
        proxy_pass http://$minio_upstream$request_uri;
        proxy_http_version 1.1;
        # 预签名 SigV4 的 host 签名基于公网站点地址(无端口)，转发 Host 必须与其完全一致。
        # 注意别 include proxy-common-headers.conf(其 Host $host 会覆盖此值)。
        proxy_set_header Host lkm-ahz.ltd;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 其余 → 前端 SSR
    location / {
        set $astro_upstream astro:4321;
        proxy_pass http://$astro_upstream;
        include proxy-common-headers.conf;
    }
}

# ---- 官网 443:TLS 终止 + 全部转发到 static 静态容器 ----
server {
    listen 443 ssl;
    http2 on;
    server_name lkm-ahz.icu www.lkm-ahz.icu;

    ssl_certificate     /etc/letsencrypt/live/lkm-ahz.icu/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/lkm-ahz.icu/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    client_max_body_size 100m;

    # 官网为纯静态站,所有请求 → static:80(独立 nginx 输出)
    location / {
        set $static_upstream static:80;
        proxy_pass http://$static_upstream;
        include proxy-common-headers.conf;
    }
}
