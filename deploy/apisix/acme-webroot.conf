# 微型 ACME responder（M5 7.2.4）：只服务 Let's Encrypt http-01 challenge 的 webroot。
# 不承担任何网关路由职责，网关全归 APISIX——本容器是「静态文件服务器」角色
# （与官网 static 同类），与 APISIX 互补而非重叠。
# 由 APISIX 的 acme-challenge 路由把 /.well-known/acme-challenge/* 转发到此。
server {
    listen 80;
    server_name _;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        try_files $uri =404;
    }

    location / {
        return 404;
    }
}
