# M6.12 监控：Prometheus 抓取配置（compose profile=monitoring / k8s 可选组件）。
#
# 只抓 backend：`/metrics` 由 core.metrics.setup_metrics 挂在单体 FastAPI 上；
# auth 进程（auth.main）刻意不挂 /metrics（见 §8 #23 的进程边界取舍），
# 故 auth 的 QPS/延迟暂不可观测——如需，加 APISIX 侧指标或给 auth 也挂 instrumentator。
global:
  scrape_interval: 15s
  evaluation_interval: 30s

# 告警规则（M6 补）：蓝图 §5.1 第 7 条要求「无 leader 或选主抖动即告警」。
# 规则内容见 ./rules/lkm-outbox.yml（同一份文件被 compose 与 k8s 共用）。
rule_files:
  - /etc/prometheus/rules/*.yml

# 告警投递（M6 补）：规则算出来的告警必须交出去才可能变成「人收到的通知」。
# 此前只有 rule_files 没有本段 —— 告警只在 Prometheus UI 里可见，没人会去盯着看，
# 等于规则白写（DBPoolExhausted / OutboxBacklogHigh 这类尤其致命）。
# 目标用服务短名，与 scrape 的 backend:8000 同理：compose 走 Docker 内嵌 DNS，
# k8s 靠 Pod 的 search 域补全（Prometheus 是 Go 程序，会应用 search domain）。
alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: lkm-backend
    metrics_path: /metrics
    static_configs:
      # compose 服务名；k8s overlay 用 FQDN 覆盖（见 deploy/k8s/README.md）
      - targets: ["backend:8000"]
